    решением о ставке, как и раньше.
  - >
    ДОБАВЛЕНО 26.08.2026 (ГЛУБОКИЙ РЕЖИМ, по прямой инициативе
    пользователя — "не быстро, а максимально глубоко"): прямой ответ на
    пункт выше. discogs_resolve_release() теперь возвращает
    "candidates" — всю группу правдоподобных прессов вместо одного
    угаданного release_id, и discogs_ensemble_stats()
    (ebay_vinyl_3x_finder.py) считает low/median/high как ВЗВЕШЕННУЮ ПО
    ЛИКВИДНОСТИ МЕДИАНУ (не среднее — среднее оказалось систематически
    смещено вверх тонкими рынками-дублями, см. weighted_median) по
    top-8 кандидатам (ENSEMBLE_MAX_CANDIDATES — у некоторых catno
    30+ дублей за десятилетия допечаток, считать по всем нежизнеспособно
    долго). Используется только когда candidates>1 (реальная
    неоднозначность) — однозначный exact-матч идёт старым дешёвым путём
    без доп. вызовов Discogs. Живой проверкой найдены и исправлены два
    сопутствующих бага: (1) промо-7"-синглы иногда делят catno с LP тем
    же альбомом — исключены явным фильтром по format; (2) наивный
    weighted MEAN на Mingus Plays Piano (Impulse A-60) давал $119.77
    вместо реальных $79.98 — несколько тонких дублей с завышенным low
    ($86-175 против $40 у доминирующей карточки) перевешивали среднее,
    хотя каждый по отдельности имел меньший вес. Это НЕ решает "какой
    именно пресс продают" (см. пункт выше — для этого всё равно нужно
    фото), а даёт более устойчивую ОЦЕНКУ ДИАПАЗОНА цен, когда несколько
    легитимных прессов делят catno. Дороже по API-вызовам (до 8
    последовательных на неоднозначный лот вместо 1) — сознательный
    компромисс "медленнее, но глубже", а не побочный эффект.
  - >
    НАЙДЕНО 27.08.2026 (живой прогон, Sonny Clark — Cool Struttin',
    "BLUE NOTE/UME ... 2014 reissue"): все фиксы выше (most_liquid по
    have, filter_by_reissue_hint, exclude_unwanted_reissues) работают
    только на УЖЕ НАЙДЕННОЙ группе кандидатов — они не помогают, если
    ПРАВИЛЬНЫЙ кандидат вообще не попал в выборку. Тут catno в тексте
    лота — голое "1588" (Blue Note печатает его без префикса BLP/BST на
    некоторых сериях), и это совпадает с ДЕСЯТКАМИ случайных релизов
    других лейблов/эпох (проверено: Capitol, Warner Bros., Atlantic,
    RCA и т.д. — все с catno "1588"). Среди них единственный релиз
    Sonny Clark с таким catno — Classic Records 2004 (аудиофильский
    рессиз, Bernie Grundman mastering, реально $100-300). Но текст
    лота явно называет другой рессиз — "UME" (Universal Music
    Enterprises, современная 2010-х серия, обычно $15-35, подтверждено
    WebSearch: "$15 brand new shrink" для стандартного тиража 2014г.).
    У UME-рессиза, по всей видимости, СОВСЕМ ДРУГОЙ формат каталожного
    номера (баркодный, не "1588") — он физически не попадает в
    catno-поиск ни при каких дизамбигуациях, потому что наш поиск
    искал не тот catno с самого начала. Итог: маржа 8.03x была
    полностью недействительна (реально ~0.6-0.8x, landed $25 против
    реальных $15-20). ОБЩАЯ ПРОБЛЕМА: голый числовой catno без
    префикса — слабый сигнал сам по себе (в отличие от "BLP"/"BST"/
