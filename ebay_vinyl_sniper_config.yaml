    лейбла); когда лейбл в тексте лота указывает на конкретную
    современную реиздательскую серию (UME, Craft, DOL, Not Now Music и
    т.п.) — это следует резолвить поиском по лейблу+альбому напрямую,
    а не через catno. Решения пока нет — фиксировать как известное
    ограничение, не наспех.
  - >
