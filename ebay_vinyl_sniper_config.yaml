# =====================================================================
# CALIBRATION EXAMPLES — 10 реальных лотов, разобранных вручную
# 25.08.2026. Использовать как regression-тесты для verdict-логики.
# Discogs-цифры актуальны на дату разбора и со временем устареют.
# =====================================================================
# landed_cost больше НЕ хардкодится — считается динамически в чекере
# по формуле §1 (price + us shipping + forwarding по весу). listing_price
# здесь — это current_price_no_shipping для budget_constraints (§4.5).
# watchers/bid_count — из скриншотов листингов, для undervalued_priority.
calibration_examples:

  - title: "Bill Connors - Theme To The Gaurdian (Germany, ECM 1057 ST)"
    listing_price: 8.00
    shipping: 6.00
    format: "single_lp"
    watchers: 4
    bid_count: 1
    discogs: { low: 8.00, median: 13.24, high: 34.77 }
    actual_condition: "VG++"   # заявлено в тайтле листинга
    expected_verdict: "REJECT"
    reason: "high едва дотягивает до x2.5, median ниже cost"

  - title: "A.R.C. - Chick Corea/Holland/Altschul (US, ECM-1-1009, Pitman Pressing)"
    listing_price: 1.99
    shipping: 5.13
    format: "single_lp"
    watchers: 2
    bid_count: 1
    discogs: { low: 4.99, median: 9.52, high: 27.91 }
    expected_verdict: "REJECT"
    reason: >
      ИСПРАВЛЕНО после добавления forwarding в Москву ($22/кг): landed
      cost вырос с $7.12 (только США) до $18.12 (+$11 форвардинг на
      1 пластинку, округление 0.4кг → 0.5кг). margin_on_high теперь
      27.91/18.12=1.54x — далеко не дотягивает даже до WATCH-порога
      (2.7x). При старой (domestic-only) себестоимости WATCH был
      оправдан high'ом ($27.91/$7.12=3.9x) — но с реальной доставкой в
      Москву апсайд этого лота съеден почти полностью.

  - title: "Steve Swallow - Home (US, ECM 1-1160, promo stamp)"
    listing_price: 8.00
    shipping: 6.00
    format: "single_lp"
    watchers: 4
    bid_count: 0
    discogs: { low: 5.50, median: 10.00, high: 28.99 }
    actual_condition: "VG++/VG+"   # заявлено в тайтле (пластинка/обложка)
    expected_verdict: "REJECT"
    reason: "cost уже выше median — типичный исход убыточен"

  - title: "Ralph Towner - Old Friends, New Friends (US, ECM-1-1153)"
    listing_price: 8.00
    shipping: 6.00
    format: "single_lp"
    watchers: 2
    bid_count: 0
    discogs: { low: 3.50, median: 10.00, high: 41.25 }
    actual_condition: "VG+"   # заявлено в тайтле
    expected_verdict: "REJECT"
    reason: >
      ИСПРАВЛЕНО после прогона чекера: в живом чате 25.08 я сравнил high
      ($41.25) с cost БЕЗ поправки на заявленный VG+ грейд — отсюда
      "почти x3". При том же подходе, что применён ко всем остальным 9
      лотам (грейд учитывается и для high тоже, не только для median):
      $41.25*0.75/$14 = 2.21x — ниже даже WATCH-порога (2.7x). Это была
      непоследовательность в ручной оценке, не ошибка чекера.

  - title: "Barre Phillips - Three Day Moon (US, ECM-1-1123)"
    listing_price: 8.00
    shipping: 6.00
    format: "single_lp"
    watchers: 2
    bid_count: 0
    discogs: { low: 8.25, median: 14.64, high: 29.07 }
    actual_condition: "VG++"   # заявлено в тайтле
    expected_verdict: "REJECT"
    reason: "даже high даёт только ~x2, потолок известен и он ниже цели"

  - title: "Egberto Gismonti - Solo (US, ECM-1-1136, 1979)"
    listing_price: 9.00
    shipping: 6.00
    format: "single_lp"
    watchers: 1
    bid_count: 0
    discogs: { low: 4.00, median: 9.25, high: 53.49 }
    expected_verdict: "REJECT"
