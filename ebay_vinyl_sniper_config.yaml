# =====================================================================
# eBay Vinyl "3x Finder" — sniper_config.yaml
# =====================================================================
# Собрано по итогам ручного разбора 10 реальных лотов (ECM jazz, eBay,
# 25.08.2026) в параллельной сессии. Логика ниже — не абстрактная,
# а прямое обобщение того, как мы считали margin вручную весь день.
#
# ВАЖНО: это конфиг (пороги/веса/справочники). Он не чинит баги в
# самом скрипте. Ниже, в блоке `known_code_issues`, — список того,
# что нужно поправить в коде отдельно от конфига. Прочитай его первым.
# =====================================================================

meta:
  config_version: 1
  last_calibrated: "2026-08-25"
  notes: >
    Discogs price stats (low/median/high) плавают день ото дня —
    пересматривать calibration_examples раз в 1-2 месяца, иначе
    пороги разъедутся с реальностью.


# ---------------------------------------------------------------------
# 1. КАК СЧИТАТЬ СЕБЕСТОИМОСТЬ (landed cost)
# ---------------------------------------------------------------------
# Текущий баг в коде: landed_cost = price + $15 (флэт). Это неверно —
# по факту на 10 разобранных лотах доставка внутри США была $5-6.60,
# а не $15. Флэт $15 либо режет реальные профитные лоты, либо (хуже)
# маскирует реальную маржу если продавец берёт дороже.
landed_cost:
  # Бери РЕАЛЬНУЮ доставку из листинга, если она указана. $15 — только
  # fallback, если доставку не удалось распарсить.
  use_listed_shipping_when_available: true
  fallback_shipping_usd:
    domestic_us: 6.00      # калибровано по реальным лотам сегодня ($5-6.60)
    canada: 18.00
    eu: 27.50
    other_international: 24.00

  # ДОБАВЛЕНО: конечная точка — Москва, а не США. Все разобранные лоты
  # покупаются у US-продавцов → везде есть ВТОРАЯ нога доставки, от
  # форвардера/консолидатора в США до Москвы. Тариф — $22 за КГ, не за
  # штуку, поэтому нужен вес, а не флэт-число. Скрипт должен прикидывать
  # вес по формату лота (см. weight_estimation_kg ниже), т.к. реальный
  # вес посылки узнаётся только на складе форвардера, а решение о ставке
  # нужно принять до этого.
  international_forwarding:
    enabled: true
    destination: "Moscow"
    rate_usd_per_kg: 22.00
    # Форвардеры почти всегда округляют вес вверх до шага тарификации —
    # ПРОВЕРЬ у своего конкретного форвардера, это либо 0.5кг, либо 1кг.
    # 0.5 — консервативная дефолт-прикидка, если округление на самом деле
    # до целого кг — реальный форвардинг может быть выше, особенно на
    # лёгких лотах (1 пластинка), где округление съедает больше всего.
    round_up_to_kg: 0.5
    # per_item — считаем forwarding отдельно для каждого лота (безопасно,
    # если покупаешь и забираешь по одному). per_shipment — вес и
    # стоимость считаются на ВСЮ отправку сразу, если консолидируешь
    # несколько лотов у форвардера перед отправкой в Москву (дешевле на
    # позицию за счёт разового округления и авиатарифа) — переключи,
    # когда появится реальная практика объединения посылок.
    basis: "per_item"

  # Вес одной пластинки со всем упаковочным весом — прикидка, не
  # взвешено реально. Промаркирована как ГРУБАЯ ОЦЕНКА (см. ниже) —
  # используется, чтобы скрипт мог прикинуть forwarding_cost ДО покупки,
  # когда точный вес ещё неизвестен.
  weight_estimation_kg:
    # ~120-180г сам винил (стандартный вес) + обложка + внутренний
    # конверт + упаковочный материал продавца (жёсткий mailer/коробка).
    packaging_kg: 0.15        # разовая тара, добавляется один раз на отправку
    single_lp_kg: 0.25        # 1 стандартный LP (не gatefold, не 180g audiophile)
    gatefold_lp_kg: 0.30      # gatefold-обложка тяжелее
    heavy_180g_lp_kg: 0.30    # если явно указано "180g" в листинге
    double_lp_kg: 0.45        # 2LP в одном gatefold/box
    extra_disc_kg: 0.20       # доп. вес за каждый диск сверх первого (для box-сетов и лотов из нескольких LP)
    # ЭТО ПРИКИДКА, не проверенные цифры — если появятся реальные веса
    # с почтовых квитанций, замени на них и заново прогони калибровку.

  # ИТОГОВАЯ ФОРМУЛА:
  # est_weight_kg = packaging_kg + Σ(вес по формату каждой пластинки в лоте)
  # billed_weight_kg = roundup(est_weight_kg, round_up_to_kg)
  # forwarding_cost = billed_weight_kg * rate_usd_per_kg
  # landed_cost = price + us_domestic_shipping (из листинга, либо fallback)
  #               + forwarding_cost
  #
  # Для аукциона current_bid ≠ финальная цена. Если ставок 0 и до конца
  # >24ч — считай landed_cost и по current_bid (нижняя граница), и по
  # прогнозной цене (см. auction_timing.projected_final_price).
  compute_both_current_and_projected: true


# ---------------------------------------------------------------------
# 2. СОПОСТАВЛЕНИЕ С DISCOGS — САМОЕ КРИТИЧНОЕ МЕСТО
# ---------------------------------------------------------------------
# Главный источник ложных срабатываний за сегодня: одно и то же
# название существует в 5-10 прессах (US/Germany/Japan/reissue/promo/
# test pressing) с РАЗБРОСОМ цены в 3-10 раз между прессами.
# Пример: Bennie Maupin — US Polydor press median $76, но есть и
# German/Japan прессы с совсем другими цифрами.
discogs_matching:
  # НЕ бери статистику с master-страницы (она мешает все прессы в кучу).
  # Всегда резолвь до конкретного release id.
  require_exact_release_match: true
  match_fields:
    - catalog_number     # читай с лейбла на фото/в описании, не с обложки
    - country
    - label               # включая суб-лейбл/дистрибьютора (напр. "Polydor Incorporated")
    - format_details      # Stereo/Mono, LP/Album, Promo/Test Pressing/Reissue
  # Если каталожный номер не удалось однозначно распарсить (плохое фото,
  # обрезанный лейбл) — не гадай по мастер-странице, помечай candidate
  # как needs_manual_catalog_check и не давай авто-PASS.
  on_ambiguous_catalog: "manual_review"
  # Каталожные номера пишутся в 3-4 разных форматах у одного и того же
  # пресса (ECM 1057 ST / ECM-1-1057 / ECM 1-1057-ST) — нормализуй перед
  # сравнением (убрать дефисы/пробелы, привести к нижнему регистру).
  normalize_catalog_number: true


# ---------------------------------------------------------------------
# 3. ОЦЕНКА СТОИМОСТИ ПЕРЕПРОДАЖИ
# ---------------------------------------------------------------------
valuation:
  # discogs_marketplace_stats должен возвращать low/median/high, а не
  # только минимальную цену (текущее имя функции подразумевает только
  # минимум — это тоже баг в коде, см. known_code_issues).
  required_fields: [low, median, high, num_sold_recent]
  # Если Discogs вернул null/insufficient data по любому из
  # low/median/high — не считать лот, пропускать (REJECT молча в лог,
  # не в candidates.csv).
  reject_on_missing_stats: true

  # Базовая оценка цены продажи — не медиана "в лоб", а медиана,
  # скорректированная на состояние конкретного экземпляра (Discogs
  # мешает в статистику все состояния от Poor до NM).
  method: "condition_adjusted_median"

  # Эвристические коэффициенты (не верифицированы количественно —
  # это прикидка по опыту сегодняшнего разбора, требует калибровки на
  # твоих реальных продажах). 1.0 = медиана Discogs соответствует
  # среднему по рынку состоянию (примерно VG+/VG++).
  condition_multiplier:
    "M": 1.6
    "NM": 1.4
    "VG++": 1.0
    "VG+": 0.75
    "VG": 0.55
    "VG-": 0.40
    "G+": 0.25
    "G": 0.15
    "Poor": 0.08
    # ИЗМЕНЕНО после прогона калибровки: было 0.6 ("пессимистично").
    # Это было необосновано — если грейд не указан явно, Discogs median
    # УЖЕ усреднён по всем состояниям на рынке, включая плохие. Занижать
    # его ещё раз без причины — задвоенный штраф. Нет данных о грейде =
    # нейтрально доверяем median, не штрафуем на ровном месте.
    unknown: 1.0

  # Доп. штраф применяется ТОЛЬКО когда явного грейда нет (unknown-ветка).
  # ИЗМЕНЕНО после калибровки: изначально штраф стакался ПОВЕРХ явного
  # numeric-грейда (напр. VG-) — это задвоение: сам грейд VG- уже
  # отражает такие дефекты (наклейка/потёртости), доп. штраф поверх него
  # утапливал оценку ниже, чем показывает здравый смысл (проверено на
  # кейсе Bennie Maupin — см. calibration_examples). Если грейд указан
  # явно — используем только condition_multiplier[грейд], без стекинга.
  defect_penalty_applies_only_when_grade_unknown: true
  defect_penalty_keywords:
    "sticker residue on label": 0.85
    "writing on label": 0.7
    "seam split": 0.9
    "warped": 0.5
    "skip" : 0.4          # проигрывает со скипами — почти не имеет смысла для продажи
    "promo stamp / not for sale": 0.85
    "cutout notch/corner": 0.85

  # Если high/low > extreme_spread_ratio — это значит цена очень
  # чувствительна к состоянию (как у Gismonti Solo: $4 - $53). В таких
  # случаях НЕ давать авто-PASS даже если median проходит порог —
  # только manual_review.
  extreme_spread_ratio: 6.0


# ---------------------------------------------------------------------
# 4. ПОРОГИ МАРЖИ И ВЕРДИКТ
# ---------------------------------------------------------------------
margin_targets:
  target_margin: 3.0          # твоя цель "x3"
  floor_margin_on_low: 1.0    # даже в худшем случае (discogs "low") не должно быть в минус
  grey_zone_lower: 1.8        # margin ниже цели, но не мусор — на watchlist
  # ДОБАВЛЕНО после калибровки: изначальные правила смотрели только на
  # margin по median и полностью игнорировали discogs.high. На практике
  # половина сегодняшних "интересных, но не факт" лотов (A.R.C., Towner,
  # Gismonti, Sacred Hymns) — это случаи "high перекрывает x3, median —
  # нет". Без этого сигнала чекер отправлял их всех в REJECT, хотя
  # руками мы верно квалифицировали их как WATCH (апсайд есть, но не
  # гарантирован). watch_on_high_threshold_pct — с каким запасом high
  # должен перекрывать target_margin, чтобы это считалось сигналом
  # (0.9 = high даёт хотя бы 90% от x3, не обязательно ровно x3).
  watch_on_high_threshold_pct: 0.9

  verdict_rules:
    # PASS — можно смело считать кандидатом на снайп/авто-ставку.
    # Намеренно строгое условие: PASS должен быть редким. Если он
    # срабатывает часто — пороги слишком мягкие, проверь на
    # calibration_examples (там ни один из 10 реальных лотов не PASS).
    - if: "NOT is_bundle AND margin_condition_adjusted >= target_margin AND margin_on_low >= floor_margin_on_low AND catalog_match == exact AND spread_ratio < extreme_spread_ratio"
      then: "PASS"
    # WATCH — median не дотягивает, но есть реальный апсайд (high) ИЛИ
    # median в серой зоне. Для лотов-бандлов (несколько пластинок одним
    # лотом) PASS в принципе не выдаём — бандл всегда требует ручного
    # решения о part-out, поэтому потолок для него — WATCH.
    - if: "margin_on_high >= target_margin * watch_on_high_threshold_pct OR margin_condition_adjusted >= grey_zone_lower"
      then: "WATCH"
    - default: "REJECT"


# ---------------------------------------------------------------------
# 4.5. БЮДЖЕТ И УПОР НА НЕДООЦЕНЁННОЕ
# ---------------------------------------------------------------------
# ДОБАВЛЕНО: бюджет ограничен, поэтому цель — не "любой лот с margin>=3x",
# а именно НЕДООЦЕНЁННЫЕ лоты: низкая текущая цена (мало кто заметил/
# участвует), а не разогретые торги, где высокая ставка уже отражает
# то, что покупатели и так видят ценность.
budget_constraints:
  # Жёсткий фильтр ДО расчёта margin: если текущая цена (ставка/BIN, БЕЗ
  # доставки) выше — лот вообще не рассматриваем, независимо от маржи.
  # Не "цена, которую готов заплатить в конце", а именно текущая — цель
  # смотреть на лоты, которые ЕЩЁ дёшевы, а не разгонять бюджет на
  # аукционах, где цена уже выросла выше твоего потолка.
  max_current_price_usd: 10.00
  # current_price — это current_bid для аукциона или BIN-цена, ВСЕГДА
  # без учёта доставки/forwarding (сравниваем с этим же полем, которое
  # видно в листинге сразу, чтобы можно было быстро отсеивать без похода
  # в Discogs).
  applies_to_field: "current_price_no_shipping"
  on_exceed: "skip_before_discogs_lookup"   # не трать Discogs API-квоту на заведомо дорогие лоты

# Приоритизация внутри того, что прошло бюджетный фильтр и margin-пороги:
# сортируем не просто по margin, а по признакам "это ещё никто не
# заметил" — при прочих равных такой лот безопаснее закрыть по низкой
# цене, чем уже разогретый.
undervalued_priority:
  enabled: true
  # Сигналы низкой конкуренции (чем их больше — тем выше приоритет):
  #   - bid_count == 0 или 1
  #   - watchers/favorites <= 2 (сравни с Bennie Maupin: 15 watchers —
  #     сигнал, что цена почти наверняка уйдёт вверх, такой лот менее
  #     "недооценён", даже если текущая ставка низкая)
  #   - "Just listed" / первые 1-3 дня показа
  #   - views за день низкий (мало кто вообще смотрел)
  low_competition_signals: ["bid_count<=1", "watchers<=2", "just_listed", "low_daily_views"]
  # Итоговый score для сортировки кандидатов (не строгая формула, эвристика):
  # priority_score = margin_condition_adjusted * (1 + 0.15 * count(low_competition_signals_matched))
  # WATCH-лоты с несколькими сигналами низкой конкуренции стоит проверять
  # РАНЬШЕ, чем PASS-лоты с толпой watchers — у вторых меньше шансов
  # закрыться по цене, которая давала расчётную маржу.


# ---------------------------------------------------------------------
# 5. ЛИКВИДНОСТЬ / ДОСТАТОЧНОСТЬ ДАННЫХ
# ---------------------------------------------------------------------
liquidity_filters:
  min_recent_sales: 3         # если по релизу продано <3 раз за история — не доверять median
  max_stats_age_days: 60       # если данные явно старые/не обновлялись — WATCH, не PASS
  min_want_have_ratio: null    # опционально: want/have как индикатор спроса (не обязателен)


# ---------------------------------------------------------------------
# 6. КОМИССИИ И РАСХОДЫ НА ПЕРЕПРОДАЖУ
# ---------------------------------------------------------------------
# ПРОВЕРЬ актуальные цифры сам — комиссии eBay/Discogs меняются,
# у меня нет доступа к твоему актуальному fee schedule.
resale_costs:
  ebay_final_value_fee_pct: 13.25   # ballpark для media/music категории, УТОЧНИ в Seller Hub
  ebay_fixed_fee_usd: 0.30
  discogs_seller_fee_pct: 9.0        # если план продавать через Discogs вместо eBay
  payment_processing_pct: 0          # обычно уже включено в eBay managed payments fee выше
  resale_shipping_cost_usd: 6.00     # media mail / bubble mailer, домашний рынок
  packaging_materials_usd: 1.50
  # Итоговая формула net-маржи для верификации перед покупкой:
  # net_proceeds = resale_price*(1-ebay_final_value_fee_pct/100) - ebay_fixed_fee_usd
  #                - resale_shipping_cost_usd - packaging_materials_usd
  # net_margin = net_proceeds / landed_cost


# ---------------------------------------------------------------------
# 7. АУКЦИОННАЯ ТАЙМИНГ-ЛОГИКА (снайпинг)
# ---------------------------------------------------------------------
auction_timing:
  # current_bid на лоте с 0-1 ставками и днями до конца — НЕ финальная
  # цена. За сегодня видели: лот с $8 стартом и 15 watchers почти
  # наверняка уйдёт выше $30-60 (Bennie Maupin), а лот с $8 стартом и
  # 0 watchers может остаться на $8 (Barre Phillips).
  projected_final_price:
    enabled: true
    # грубая эвристика: чем больше watchers/views и чем ближе к концу,
    # тем выше множитель к текущей цене. Требует калибровки на
    # реальных исходах твоих аукционов — цифры ниже это стартовая прикидка.
    watcher_multiplier:
      "0-2": 1.0
      "3-6": 1.3
      "7-15": 1.8
      "15+": 2.5
  # Ставь не сразу, а в последние минуты — чтобы не разгонять цену
  # самому и не палить интерес другим участникам раньше времени.
  snipe_window_minutes_before_end: 3
  # Не участвуй в псевдо-аукционах с ставками руками на раннем этапе —
  # только добавляй в watchlist и пересчитывай margin по мере роста ставок.
  early_bid_policy: "watchlist_only"
  # Макс. цена, которую готов заплатить, чтобы даже при худшем (low)
  # раскладе не уйти в минус:
  # max_bid = (discogs_low * condition_multiplier) / floor_margin_on_low - shipping - fees_buffer
  max_bid_formula: "auto"


# ---------------------------------------------------------------------
# 8. СКОУП ПОИСКА
# ---------------------------------------------------------------------
search_scope:
  labels_priority:
    - "ECM Records"          # основной фокус разбора 25.08.2026
    - "Blue Note"
    - "Impulse!"
    - "Verve"
    - "Atlantic Records jazz"   # ИСПРАВЛЕНО: было "Atlantic (jazz)" — скобки как
                                # часть текста поискового запроса eBay не
                                # дизамбигуируют лейбл от рок-каталога Atlantic,
                                # просто портят выдачу; "jazz" обычным словом
                                # сужает точнее (build_search_queries просто
                                # добавляет "vinyl lp" к каждой строке ниже)
    # ДОБАВЛЕНО (расширение поиска по просьбе пользователя 25.08.2026) —
    # тот же фокус (джаз), шире охват: лейблы с сильным коллекционным
    # спросом на Discogs, не только "большая четвёрка" выше
    - "Prestige Records"
    - "Riverside Records"
    - "Contemporary Records"
    - "CTI Records"
    - "Black Saint Soul Note"
    - "SteepleChase Records"
    - "Pablo Records"
    # ДОБАВЛЕНО 26.08.2026 (по просьбе пользователя — максимальный
    # охват): те же критерии (джаз, сильный коллекционный спрос на
    # Discogs), лейблы, которых раньше не было в scope вообще.
    - "Milestone Records jazz"
    - "Muse Records jazz"
    - "Strata-East Records"
    - "Xanadu Records jazz"
    - "Savoy Records jazz"
    - "MPS Records jazz"
    - "Black Lion Records jazz"
    - "Delmark Records"
    - "Enja Records"
    - "Argo Cadet jazz"
    - "Vee-Jay Records jazz"
    - "Pacific Jazz Records"
    - "World Pacific Records jazz"
    - "Flying Dutchman Records"
    - "Black Jazz Records"
    - "Cobblestone Records jazz"
    - "Mainstream Records jazz"
    - "Three Blind Mice jazz"     # японский аудиофильский джаз-лейбл
    - "Trio Records Japan jazz"
  # Дополнительные проходы сортировки eBay Browse API на каждый запрос
  # выше (добавлено 26.08.2026, см. search_ebay() в
  # ebay_vinyl_3x_finder.py) — дефолтный Best Match ранжирует по
  # вовлечённости и систематически прячет именно недооценённые лоты
  # (0-1 ставок, никто не заметил). newlyListed ловит лоты ДО того, как
  # их вообще кто-то увидел; endingSoonest — аукционы на грани закрытия,
  # где ни у кого физически не было времени взвинтить цену. Проверено
  # вживую 26.08.2026 — оба реально меняют порядок выдачи. Цена этого —
  # кратный рост числа запросов к eBay и (после дедупа) объёма лотов,
  # доходящих до Discogs — с deep mode вместе они делают прогон заметно
  # длиннее одного бюджетного цикла, это осознанный компромисс "не
  # быстро, а максимально широко".
  sort_passes:
    - "bestMatch"
    - "newlyListed"
    - "endingSoonest"
  exclude_format_keywords: ["CD", "cassette", "8-track", "digital"]
  flag_not_autoreject_keywords:   # не отбрасывай авто, но помечай для ручной проверки
    - "promo"
    - "test pressing"
    - "white label"
  hard_exclude_keywords:
    - "repro"
    - "bootleg"
    - "unofficial"
    - "no record"          # "cover only" листинги


# ---------------------------------------------------------------------
# 9. ВЫВОД
# ---------------------------------------------------------------------
output:
  csv_path: "candidates_{date}.csv"
  columns:
    - listing_url
    - title
    - current_price
    - shipping
    - landed_cost
    - projected_final_price
    - discogs_release_url
    - catalog_match_confidence   # exact | fuzzy | manual_review
    - photo_review_urls          # ДОБАВЛЕНО (п.1 обратной связи 25.08.2026): заполняется,
                                  # когда catalog_match_confidence != exact — фото лота для
                                  # ручной/vision-сверки номера с лейбла, т.к. каталожный
                                  # номер почти никогда не встречается в тексте листинга
    - discogs_low
    - discogs_median
    - discogs_high
    - spread_ratio
    - condition_listed
    - condition_multiplier_applied
    - resale_estimate
    - margin_on_low
    - margin_condition_adjusted
    - verdict                    # PASS | WATCH | REJECT
    - notes
    # ДОБАВЛЕНО 29.08.2026 (ТЗ п.3 — прозрачность вердикта): дописано в
    # КОНЕЦ списка намеренно, не переставляя существующие колонки — не
    # ломает уже сохранённые candidates_*.csv за прошлые даты.
    - resolution_confidence      # high | medium | low — см. ensemble_resolution_confidence()
    - candidate_count            # сколько прессов реально участвовало в ансамблевой оценке
    - degraded_pricing           # true, если median/high = low*2 (Discogs Seller Settings не заполнены)
    - pricing_source             # price_suggestions | degraded_2x_low


# =====================================================================
# РОССИЙСКИЙ КОНТУР (ТЗ v2, P0-1/P0-2/P0-3/P1-6) — 30.08.2026
# =====================================================================
# Всё, что превращает "насколько пресс ценен глобально" в "сколько я
# реально выручу в Москве". До появления этого блока вердикт оптимизировал
# не ту величину (см. §7 README и разбор Bennie Green PRLP 7049).
ru_market:
  enabled: true

  # --- P1-6 п.4: ставки НЕ константы в коде, а конфиг с датой ---
  # Ставка уже росла $17 -> $22/кг; молчаливый расчёт по устаревшей ставке
  # двигает все вердикты сразу. Если rates_updated_at старше
  # rates_stale_after_days — скрипт печатает предупреждение в начале прогона.
  cargo_rate_usd_per_kg: 22.00
  fx_rate_rub_per_usd: 84.60
  rates_updated_at: "2026-08-30"
  rates_stale_after_days: 30

  # --- P0-2: издержки стороны сбыта (переработано 30.08 по «Решениям» §1) ---
  # БЫЛО: единая комиссия 0.10 и безусловный вычет доставки 400₽. Оба
  # допущения неверны и тянут в одну сторону — занижают маржу дважды.
  #
  # 1) Комиссия — свойство КАНАЛА, а не константа. margin_ru считается по
  #    ЛУЧШЕМУ доступному каналу, и он же попадает в вывод (best_channel) —
  #    это заодно подсказка, куда выставлять.
  # 2) Доставка вычитается ТОЛЬКО если комп-цена её уже включает. На Мешке
  #    типовая схема — доставку платит покупатель, и безусловный вычет 400₽
  #    там был двойным счётом (см. price_includes_delivery у источников).
  # 3) promo_rub — платное продвижение. На неликвиде включается почти
  #    всегда, поэтому это явная строка, а не размазанная поправка.
  channels:
    - name: meshok
      commission_pct: 0.03      # у Мешка комиссия низкая
      seller_pays_delivery: false
      promo_rub: 0
    - name: avito
      commission_pct: 0.10
      seller_pays_delivery: true   # Авито Доставка: цена обычно «с доставкой»
      promo_rub: 300               # продвижение, на неликвиде де-факто обязательно
    - name: marketvinila
      commission_pct: 0.05
      seller_pays_delivery: false
      promo_rub: 0

  delivery_rub: 400          # СДЭК/Авито Доставка по РФ, одна пластинка
  packaging_rub: 150         # конверт-протектор, картон, пузырь.
                             # При отправке нескольких пластинок ОДНОМУ
                             # покупателю это одна упаковка, а не N — см.
                             # packaging_shared_in_batch.
  packaging_shared_in_batch: true

  # Включает ли комп-цена доставку. Определяется источником, а не каналом:
  # это про то, что означает само число, которое мы взяли за ориентир.
  price_includes_delivery_by_source:
    meshok_sold: false         # цена лота, доставку платит покупатель
    marketvinila_ask: false    # выставленная цена пластинки
    segment_model: false

  # --- P0-3: вероятность продажи и срок оборота ---
  # p_sale_90d стартово выводится из ru_sold_n за 12 мес и ru_supply_count
  # (конкуренты, уже стоящие в РФ). Числа НЕ измерены — это стартовые
  # допущения, которые заменяются фактом в P2-8, когда накопятся сделки.
  p_sale_base_by_sold_n:     # сколько продаж за 12 мес -> вероятность за 90 дн
    "0": 0.10
    "1": 0.30
    "2": 0.45
    "3": 0.60
    "5": 0.75
    "10": 0.88
  # Каждая конкурирующая копия в продаже режет вероятность
  supply_penalty_per_copy: 0.08
  p_sale_floor: 0.03
  p_sale_ceiling: 0.92
  default_days_to_sale: 120  # для roi_annualized, пока нет своей статистики

  # --- P0-3: 3x остаётся ПОРОГОМ РИСКА для неликвида, а не целью ---
  illiquid_requires_3x:
    enabled: true
    when_sold_n_below: 1     # продаж за 12 мес нет
    when_supply_count_at_least: 5
    required_margin_ru: 3.0

  # Минимальная margin_ru для WATCH, когда ликвидность нормальная.
  # Ниже — сделка не окупает возню и риск.
  min_margin_ru_watch: 1.5
  min_margin_ru_pass: 2.0



  # ------------------------------------------------------------------
  # ЧЕСТНЫЙ margin_ru: уровень цен от Мешка, структура прессов от Discogs
  # (ТЗ «архив и margin_ru» §3a). Ни один источник по отдельности не годится:
  #   Discogs знает ОТНОСИТЕЛЬНУЮ ценность прессов внутри альбома,
  #            но не знает абсолютного уровня московских цен;
  #   Мешок   знает АБСОЛЮТНЫЙ уровень и ликвидность,
  #            но не различает прессы — по каталожному номеру он не ищет.
  #
  #   press_ratio    = world_press_price / world_album_median
  #   ru_press_price = ru_album_median * (1 + beta * (press_ratio - 1))
  #
  # beta — доля глобальной премии за пресс, которую платит московский рынок.
  press_premium:
    # Стартовое значение по ТЗ. Осознанно консервативно: при ставке на
    # аукционе ошибиться вниз дешевле, чем вверх.
    beta_default: 0.5
    # По каналам: аудитория МаркетВинила разбирается в прессах,
    # аудитория Авито — нет.
    beta_by_channel:
      marketvinila: 0.7
      meshok: 0.5
      avito: 0.25
      скупка: 0.1
    # Потолок и пол на итоговый множитель — защита от выброса в
    # world_album_median, который на редких альбомах считается по двум
    # позициям и способен дать press_ratio в десятки.
    multiplier_min: 0.4
    multiplier_max: 3.0
    # ИЗМЕРЕНО по архиву (docs/moscow_market_report.md §9): внутри одного
    # альбома московское отношение «оригинал / не-оригинал» = 1.12x при
    # квартилях 0.84–2.17. Глобально оригиналы стоят кратно больше, значит
    # фактическая beta заметно НИЖЕ 0.5. Значение не меняем, пока выборка
    # 34 альбома, но помним: 0.5 — верхняя граница, а не середина.
    measured_ru_original_premium: 1.12
    measured_on_albums: 34

  # ТЗ §3d: ноль продаж за окно — это ОТВЕТ, а не отсутствие данных.
  zero_sales_caps_verdict_at: "WATCH"
# =====================================================================
# KNOWN CODE ISSUES (не конфиг — правится в самом скрипте)
# =====================================================================
known_code_issues:
  - "landed_cost сейчас = price + flat $15. Заменить на use_listed_shipping_when_available (см. §1)."
  - "discogs_marketplace_stats судя по названию возвращает только минимальную цену. Нужно тянуть low/median/high — это разные числа Discogs API (price_suggestions/marketplace stats), одной минималки недостаточно для расчёта margin_condition_adjusted."
  - "Сопоставление лота с Discogs идёт, похоже, через master-страницу/поиск по названию. Нужно резолвить до конкретного release по catalog_number+country (см. §2) — иначе на one в 3-10 раз ошибка в оценке, как было с Bennie Maupin/Bill Connors сегодня."
  - "Нет obработки 'нет данных' (null low/median/high) — такие релизы не должны попадать в PASS."
  - "EBAY_CLIENT_ID/SECRET всё ещё плейсхолдеры — без них скрипт не может вообще ничего проверить, это блокер #1 прямо сейчас, config тут не поможет."
  - >
    ДОБАВЛЕНО после первого живого прогона (25.08.2026): у используемого
    Discogs-токена не заполнены Seller Settings -> marketplace/price_suggestions
    всегда 404 ("You must fill out your seller settings first"), даже без
    намерения реально продавать. Пользователь решил не заводить seller-профиль
    ради этого, поэтому скрипт работает в DEGRADED MODE: median и high
    приравниваются к low (см. discogs_get_stats() в ebay_vinyl_3x_finder.py).
    Практическое следствие для verdict_rules (§4): т.к. margin_on_high теперь
    ВСЕГДА равен margin_condition_adjusted, ветка WATCH "margin_on_high >=
    target*watch_on_high_threshold_pct" перестаёт быть независимым сигналом —
    она математически поглощается условием "margin_condition_adjusted >=
    grey_zone_lower" (grey_zone_lower=1.8 ниже, чем target*0.9=2.7, значит
    более мягкое условие всегда решает первым). Именно ради этой ветки A.R.C.,
    Gismonti Solo и Sacred Hymns в calibration_examples получали WATCH — с
    настоящими Discogs-цифрами. В degraded mode такой сигнал "high перекрывает
    x3, а median — нет" физически не может сработать: spread_ratio тоже всегда
    1.0, поэтому extreme_spread_ratio (§3) тоже не имеет эффекта. Это не
    поломка чекера — PASS/WATCH логика внутренне непротиворечива и на всех 10
    calibration_examples по-прежнему даёт 10/10 (см. test_calibration.py) — а
    системное сужение того, что вообще может пройти дальше low. На сегодняшних
    10 лотах расхождений с live-скриптом нет ЧИСТО ПО СОВПАДЕНИЮ: у всех трёх
    (A.R.C., Gismonti, Sacred Hymns) после добавления forwarding в Москву
    margin_on_high и так упал ниже WATCH-порога, REJECT совпал бы в любом
    случае. Для новых лотов это совпадение не гарантировано — деградированный
    режим будет пропускать часть реальных WATCH-кандидатов, где ИМЕННО high
    (а не median) перекрывает цель. Единственные пути вернуть двухуровневую
    median/high логику: (1) заполнить Discogs Seller Settings и разблокировать
    price_suggestions, либо (2) скрейпить блок 'Price Statistics' со страницы
    релиза на discogs.com напрямую — так считались calibration_examples
    вручную, это ДРУГОЙ источник данных, с price_suggestions не сверялся и
    может не совпадать с ним даже при доступном API.
  - >
    ДОБАВЛЕНО: eBay Browse API не отдаёт watchers/views (см. ЧЕСТНО О
    ГРАНИЦАХ в шапке ebay_vinyl_3x_finder.py) — undervalued_priority (§4.5)
    реально работает только по сигналу bid_count<=1, сигнал watchers<=2
    никогда не участвует (watchers всегда захардкожен в 0 при сборке
    example). Для практического использования это не критично: список
    кандидатов после margin+budget фильтра короткий, watchers можно
    проверить глазами в браузере перед решением о ставке — именно на этом
    шаге стоило бы заметить 15 watchers у Bennie Maupin вручную, а не
    полагаться на автоматику.
  - >
    ДОБАВЛЕНО 26.08.2026 (ручной разбор пользователя, Jobim — Wave):
    most_liquid() (см. ebay_vinyl_3x_finder.py) правильно решает случай
    "одна и та же пластинка задублирована на Discogs несколькими
    карточками" (OJC-серия — см. decisions_log.csv), но НЕ умеет
    отличить его от случая "catno честно делят НЕСКОЛЬКО РАЗНЫХ, оба
    легитимных лейбл-вариантов оригинального тиража" (напр. Wave
    SP-3002: release/3044240 VAN GELDER matrix vs release/9811916
    Monarch Pressing — оба реальные 1967/68 US пресса с независимой
    историей продаж). В таком случае "самая ликвидная карточка" — это
    просто наугад более задокументированный вариант, а не тот, что
    реально продаётся в конкретном лоте (различить можно только по
    фото лейбла/матрицы). Для Wave это увело оценку ДАЛЬШЕ от
    реальности пользователя ($79.98 вместо его $25-40), а не ближе.
    Так как confidence в обоих случаях всё равно manual_review —
    ущерба для verdict-логики нет (лот не может попасть в PASS), но
    конкретное число медианы в выводе может быть заметно завышено на
    альбомах с широким разбросом цен между прессами. Решения нет без
    доп. сигнала (матрица/лейбл на фото) — не пытаться угадывать
