    baseline.py и test_catno_normalization.py) — набор митигаций поверх
    (не вместо) описанных выше ограничений, т.к. "правильную" цену
    конкретного пресса без фото лейбла всё ещё узнать нельзя:
    (1) discogs_ensemble_stats()/ensemble_resolution_confidence() —
    новое поле resolution_confidence ('high'/'medium'/'low'):
    'low', если топ-по-ликвидности кандидат сам по себе (по медиане) в
    ENSEMBLE_OUTLIER_RATIO=2.5+ раз дороже медианы остальных кандидатов
    (ловит именно паттерн "дорогой культовый оригинал доминирует");
    (2) отдельно — 'low' безусловно, если release["catno_found"] пуст
    (голый catno / фаззи-поиск по названию без единого текстового якоря,
    см. Sonny Clark/Blue Train выше — это ловит случаи, которые (1) не
    поймал, т.к. топ и второй кандидат были близки по have, просто
    РАЗНЫЕ переиздания); (3) discogs_get_stats() возвращает pricing_
    source ('price_suggestions'/'degraded_2x_low'); (4) process_item()
    понижает verdict на ступень при resolution_confidence='low'
    (PASS->WATCH, WATCH->REJECT) и не даёт PASS вообще при degraded
    pricing_source; (5) обе величины плюс candidate_count — новые
    колонки в candidates_*.csv/decisions_log.csv (дописаны в конец, не
    ломая старую схему). Живой тест на 5 подтверждённых кейсах
    переоценки — ВСЕ 5 (Eric Dolphy $85/$200, Shamek Farrah, Blue Train,
    Sonny Clark) теперь REJECT вместо ложного WATCH; 2 заведомо
    корректных резолва (Blue Mitchell OJC exact-матч, Mariachi Brass
    WPS-паттерн) не пострадали. НЕ РЕШЕНО: точная цена всё ещё неизвестна
    без фото — это explicit понижение доверия, а не попытка угадать
    точнее (см. запрет "не выдумывать источник данных" в ТЗ). Также ТЗ
    п.1.4 просил взять "последнюю проданную цену" из Discogs как более
    точный источник вместо median=low*2 — ПРОВЕРЕНО: используемые
    эндпоинты (/marketplace/stats/{id}, /marketplace/price_suggestions/
    {id}) исторических sold-цен НЕ отдают вообще, только текущую
    минимальную listing-цену и опциональные price_suggestions (нужны
    Seller Settings). "Медиана реальных продаж" и "последняя продажа
    DATE", которые пользователь приводил вручную весь день — это данные
    со страницы Discogs "Marketplace > Statistics" в браузере, НЕ из API,
    которым пользуется скрипт; программного доступа к ним через
    используемый API нет — источник для них не выдуман, а честно
    недоступен в текущей интеграции.

  - >
    ПРОВЕРЕНО ВЖИВУЮ 30.08.2026 (подготовка к P1-5 из ТЗ v2, sweep по
    продавцу). ГИПОТЕЗА ТЗ ПОДТВЕРДИЛАСЬ: в прогоне Режима 1 от 30.08 шесть
    находок подряд (Bennie Green PRLP7049, Miles Davis Steamin PRLP7200,
    Miles Davis Relaxin PRLP7129, Red Garland/Coltrane Dig It PRLP7229,
    Coltrane Lush Life PRLP7188, Walter Bishop PRST7730) оказались лотами
    ОДНОГО продавца — oldcrowqueen, 1675 отзывов. То есть неверно
    оценённые лоты действительно идут пачками, потому что оценивает их
    один человек, и продавец как единица работы — правильная идея.
    НО МЕХАНИЗМ ИЗ ТЗ НЕ РАБОТАЕТ КАК ОПИСАНО: запрос к Browse API с
    filter=sellers:{oldcrowqueen} и category_ids=176985 возвращает HTTP 200
    без ошибок, но total=1 — то есть ОДИН лот вместо шести известных
    активных. Фильтр принимается, но не отдаёт весь ассортимент продавца
    (ни с q, ни с category_ids без q). Значит «вытянуть все его активные
    листинги фильтром по seller» — не реализуемо на этом API так, как
    предполагает ТЗ.
    РАБОЧАЯ АЛЬТЕРНАТИВА (не реализована, зафиксирована как план): продавец
    и так известен для каждого найденного лота из item detail, который мы
    уже запрашиваем. Значит sweep можно делать не запросом к API, а
    группировкой СВОИХ находок по seller внутри прогона: два и более
    попадания у одного продавца — сигнал «здесь распродажа коллекции»,
    и такого продавца стоит смотреть руками в браузере. Это дешевле по
    вызовам и не зависит от неработающего фильтра.


# =====================================================================
# CALIBRATION EXAMPLES — 10 реальных лотов, разобранных вручную
# 25.08.2026. Использовать как regression-тесты для verdict-логики.
# Discogs-цифры актуальны на дату разбора и со временем устареют.
# =====================================================================
# landed_cost больше НЕ хардкодится — считается динамически в чекере
# по формуле §1 (price + us shipping + forwarding по весу). listing_price
# здесь — это current_price_no_shipping для budget_constraints (§4.5).
# watchers/bid_count — из скриншотов листингов, для undervalued_priority.
calibration_examples:

  - title: "Bill Connors - Theme To The Gaurdian (Germany, ECM 1057 ST)"
    listing_price: 8.00
    shipping: 6.00
    format: "single_lp"
    watchers: 4
    bid_count: 1
    discogs: { low: 8.00, median: 13.24, high: 34.77 }
    actual_condition: "VG++"   # заявлено в тайтле листинга
    expected_verdict: "REJECT"
    reason: "high едва дотягивает до x2.5, median ниже cost"

  - title: "A.R.C. - Chick Corea/Holland/Altschul (US, ECM-1-1009, Pitman Pressing)"
    listing_price: 1.99
    shipping: 5.13
    format: "single_lp"
    watchers: 2
    bid_count: 1
    discogs: { low: 4.99, median: 9.52, high: 27.91 }
    expected_verdict: "REJECT"
    reason: >
      ИСПРАВЛЕНО после добавления forwarding в Москву ($22/кг): landed
      cost вырос с $7.12 (только США) до $18.12 (+$11 форвардинг на
      1 пластинку, округление 0.4кг → 0.5кг). margin_on_high теперь
      27.91/18.12=1.54x — далеко не дотягивает даже до WATCH-порога
      (2.7x). При старой (domestic-only) себестоимости WATCH был
      оправдан high'ом ($27.91/$7.12=3.9x) — но с реальной доставкой в
      Москву апсайд этого лота съеден почти полностью.

  - title: "Steve Swallow - Home (US, ECM 1-1160, promo stamp)"
    listing_price: 8.00
    shipping: 6.00
    format: "single_lp"
    watchers: 4
    bid_count: 0
    discogs: { low: 5.50, median: 10.00, high: 28.99 }
    actual_condition: "VG++/VG+"   # заявлено в тайтле (пластинка/обложка)
    expected_verdict: "REJECT"
    reason: "cost уже выше median — типичный исход убыточен"

  - title: "Ralph Towner - Old Friends, New Friends (US, ECM-1-1153)"
    listing_price: 8.00
    shipping: 6.00
    format: "single_lp"
    watchers: 2
    bid_count: 0
    discogs: { low: 3.50, median: 10.00, high: 41.25 }
    actual_condition: "VG+"   # заявлено в тайтле
    expected_verdict: "REJECT"
    reason: >
      ИСПРАВЛЕНО после прогона чекера: в живом чате 25.08 я сравнил high
      ($41.25) с cost БЕЗ поправки на заявленный VG+ грейд — отсюда
      "почти x3". При том же подходе, что применён ко всем остальным 9
      лотам (грейд учитывается и для high тоже, не только для median):
      $41.25*0.75/$14 = 2.21x — ниже даже WATCH-порога (2.7x). Это была
      непоследовательность в ручной оценке, не ошибка чекера.

  - title: "Barre Phillips - Three Day Moon (US, ECM-1-1123)"
    listing_price: 8.00
    shipping: 6.00
    format: "single_lp"
    watchers: 2
    bid_count: 0
    discogs: { low: 8.25, median: 14.64, high: 29.07 }
    actual_condition: "VG++"   # заявлено в тайтле
    expected_verdict: "REJECT"
    reason: "даже high даёт только ~x2, потолок известен и он ниже цели"

  - title: "Egberto Gismonti - Solo (US, ECM-1-1136, 1979)"
    listing_price: 9.00
    shipping: 6.00
    format: "single_lp"
    watchers: 1
    bid_count: 0
    discogs: { low: 4.00, median: 9.25, high: 53.49 }
    expected_verdict: "REJECT"
    reason: >
      ИСПРАВЛЕНО после добавления forwarding в Москву: landed cost
      $15→$26 (+$11 форвардинг). margin_on_high = 53.49/26=2.06x —
      ниже WATCH-порога (2.7x), несмотря на то что spread по-прежнему
      экстремальный (~13x low/high). До учёта доставки в Москву апсайд
      этого лота выглядел интереснее, чем есть на деле — при $22/кг
      маленькие дешёвые лоты (1 пластинка ~$9) особенно чувствительны,
      т.к. округление веса (0.4кг→0.5кг) даёт минимум $11 форвардинга
      почти вне зависимости от реальной массы посылки."

  - title: "Bennie Maupin - The Jewel In The Lotus (US, ECM 1043 ST / Polydor)"
    listing_price: 8.00
    shipping: 6.00
    format: "single_lp"
    watchers: 15
    bid_count: 1
    discogs: { low: 50.00, median: 76.01, high: 232.56 }
    actual_condition: "VG-"   # грейд пластинки; "sticker residue" — уже часть смысла VG-, не штрафуем повторно
    expected_verdict: "WATCH"
    reason: >
      ИСПРАВЛЕНО после прогона чекера: изначально стояло PASS — это было
      оптимистично, посчитано на глаз без единой формулы. Честно по
      условию VG-: median-based оценка ~$76*0.40=$30.4 → margin
      ~2.17x, ниже чистого порога x3. High всё ещё даёт большой апсайд
      (~6.6x) — поэтому WATCH, а не REJECT. ВАЖНО для undervalued_priority:
      15 watchers — это САМЫЙ разогретый лот из всех десяти, по духу
      "недооценённое" здесь уже под вопросом, даже если цифры маржи
      хорошие — вероятно уйдёт заметно выше текущей ставки."

  - title: "Keith Jarrett - Sacred Hymns (US, ECM-1-1174, Wakefield Pressing)"
    listing_price: 5.00
    shipping: 5.00
    format: "single_lp"
    watchers: 2
    bid_count: 0
    discogs: { low: 1.23, median: 5.39, high: 46.51 }
    expected_verdict: "REJECT"
    reason: >
      ИСПРАВЛЕНО после добавления forwarding в Москву: landed cost
      $10→$21 (+$11 форвардинг). margin_on_high = 46.51/21=2.21x —
      ниже WATCH-порога. При domestic-only себестоимости ($10) high
      давал 4.65x — солидный запас; после $11 форвардинга на дешёвом
      лоте этот запас почти исчез. Показательный пример того, что $22/кг
      сильнее всего бьёт по лотам с низкой стартовой ценой — форвардинг
      на них съедает непропорционально большую долю потенциальной маржи."

  - title: "Art Lande - Rubisa Patrol (US, ECM 1081, 1976)"
    listing_price: 5.00
    shipping: 5.00
    format: "single_lp"
    watchers: 3
    bid_count: 0
    discogs: { low: 5.99, median: 8.90, high: 14.00 }
    expected_verdict: "REJECT"
    reason: "потолок цены ($14) известен и он ниже x3 цели — невозможно математически"

  - title: "Jazz Lot of 5 LPs (Ellington/Hancock&Corea/MJQ/Swingles-MJQ/Art Tatum)"
    listing_price: 7.99
    shipping: 6.60
    format: "bundle_single_lp"
    record_count: 5
    watchers: 2
    bid_count: 1
    discogs_bundle_sum: { median_sum: 28.66, high_sum: 154.28 }
    expected_verdict: "WATCH"
    reason: "лот из 5 позиций — сумма медиан даёт только ~x2, x3 возможен только при поштучной перепродаже и удаче в верхнем диапазоне 1-2 позиций; доп. расходы при парт-ауте съедают часть маржи, учитывать это в net_margin"
