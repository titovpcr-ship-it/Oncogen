name: Barik B2 example generation
on:
  push:
    branches: [codex/b2-content]
    paths:
      - '.github/workflows/barik-b2-fill.yml'
      - 'apps/barik/tools/gen_examples.py'
      - 'apps/barik/tools/build_examples.py'
      - 'apps/barik/tests/test_examples_generation.py'
  workflow_dispatch:
permissions:
  contents: write
  models: read
concurrency:
  group: barik-b2-generation
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            apps/barik/data
            apps/barik/tools
            apps/barik/tests
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install generator dependency
        run: python -m pip install requests
      - name: Check generation safeguards offline
        run: python apps/barik/tests/test_examples_generation.py
      - name: Fill B2 using the job model token
        id: generate
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p apps/barik/out
          set -o pipefail
          python -u apps/barik/tools/gen_examples.py --level B2 --provider github --model openai/gpt-4.1-mini --minutes 320 --batch 24 --max-output-tokens 4000 --max-calls 250 --rounds 3 --include-multiword | tee apps/barik/out/examples-b2-generation.log
      - name: Save accepted examples to the content branch
        if: always()
        run: |
          if ! git diff --quiet -- apps/barik/data/examples/gen_b2.txt; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add apps/barik/data/examples/gen_b2.txt
            git commit -m 'content(barik): checkpoint accepted B2 examples'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: barik-b2-examples-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/barik/data/examples/gen_b2.txt
            apps/barik/out/examples-b2-summary.json
            apps/barik/out/examples-b2-generation.log
          retention-days: 30
      - name: Report stopped generation
        if: steps.generate.outcome == 'failure'
        run: exit 1
