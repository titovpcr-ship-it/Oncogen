name: Barik full audit
on:
  push:
    branches: [codex/audit4]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: barik-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-curl
          python -m pip install requests Pillow pyzipper
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Run Barik tests including SEO
        env:
          BARIK_ONLY: '1'
          BARIK_WEB_PAID: '1'
        run: bash tools/check_all.sh --full
      - name: Measure language loading (cold Moscow guest)
        if: always()
        run: node apps/barik/tests/benchmark_i18n.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: barik-test-logs
          path: out/check/
          retention-days: 7
