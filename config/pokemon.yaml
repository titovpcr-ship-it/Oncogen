# =====================================================================
# Ветка pokemon_tcg — запечатанные бустер-паки и мини-тины до $20
# =====================================================================
# Составлено 06.09.2026 по заданию заказчика. Отдельный файл, чтобы не
# смешивать с винилом: у веток разные ограничения. В виниле ограничение
# — деньги, здесь — КИЛОГРАММЫ. Карго берёт $22 за кг с минимумом в
# один кг, и посылка на сто граммов стоит те же $22, поэтому главная
# метрика ранжирования — прибыль на килограмм, а мультипликатор
# работает только отсекающим фильтром.
# =====================================================================

meta:
  branch: pokemon_tcg
  created: "2026-09-06"
  segment: "sealed booster packs & mini tins, <= $20, US sellers only"

# --- карго ---
# Тариф тот же, что в винильной ветке, и по той же причине: это тариф
# конкретного американского форвардера заказчика, а не рыночная
# средняя. Минимум в 1 кг — то, из-за чего ветка вообще работает в
# сегменте до $20: дешёвые лёгкие позиции добивают вес корзины.
cargo_usd_per_kg: 22.0
cargo_min_kg: 1.0
cargo_round_step_kg: 1.0     # поставь 0.1, если карго считает подробнее
pack_overhead: 1.15          # упаковка и пузырчатка сверх веса нетто

# --- деньги ---
usdrub_source: cbr           # cbr-xml-daily, кэш на сутки в cache/usdrub.json

# ЦЕНОВАЯ ПОЛОСА — ГЛАВНОЕ ИЗМЕНЕНИЕ ОТ 06.09.2026 (решение владельца).
# Рыночная цена современного бустер-пака $7.90 (PriceCharting, ungraded;
# TCGplayer $7.97). Лот за $18 не может окупиться, сколько бы он ни
# стоил в Москве, — поэтому потолок опущен с $20 до $13. Пол в $5
# отсекает зону подделок, куда смотрит и правило 60%.
# ПОЛОСА ОТНОСИТСЯ К ЦЕНЕ ЗА ЕДИНИЦУ, А НЕ ЗА ЛОТ. Ошибка первой
# редакции: потолок $13 применялся к цене лота, и лот из десяти паков за
# $60 не попадал в выдачу вовсе — отсекался ровно тот товар, ради
# которого всё затевалось.
#
# Деньгами это стоит полутора landed. Английских лотов в сегменте один на
# семьдесят просмотренных; чтобы набрать килограмм (39.5 пака), поодиночке
# надо покупать у сорока продавцов, и доставка по США $4.50 за отправление
# ложится на каждый пак:
#   40 одиночных лотов: $5.50 + $4.50 + $0.56 = $10.56 = 914 ₽
#   4 лота по 10 паков: $6.00 + $0.60 + $0.56 =  $7.16 = 620 ₽
price_band_applies_to: unit
min_unit_price_usd: 5.0
max_unit_price_usd: 13.0
# Потолок ЛОТА отдельный и широкий: фильтр eBay работает по цене лота,
# и сузить его до $13 значит потерять многопаковые лоты ещё до разбора.
max_lot_price_usd: 120.0
# ПОЛ ПО ЦЕНЕ ЛОТА ВЫВОДИТСЯ ИЗ ДВУХ ПРЕДЫДУЩИХ, а не назначается.
# Лот дешевле, чем min_unit_price_usd × min_units_per_lot, арифметически
# не может содержать нужное число паков по нужной цене — то есть не
# может стать покупкой. Проверять это на стороне eBay дешевле по квоте,
# чем тащить такие лоты к себе и отсеивать.
#
# Замер 06.09.2026, который этого потребовал: при поле $5 и восходящей
# сортировке первые 400 лотов категории — сплошь одиночные позиции по
# $5-6, и многопаковых в выдаче оказалось 8 из 809, причём ни одного
# годного. При поле $25 в выдаче сразу «Destined Rivals Booster Packs
# Art Set Lot of 4» и «(4) Mega Evolutions Sleeved Booster Packs».
# null — вывести; число — задать вручную.
min_lot_price_usd: null
# В режиме разведки пол НЕ применяется: её задача — увидеть, чего нет в
# таблице цен, а не найти покупку.
discover_ignores_lot_floor: true
# Одиночный лот BUY не получает никогда: доставка по США съедает маржу.
# Считается по ПАКАМ, а не по позициям — см. packs_per_unit ниже.
min_units_per_lot: 5

# СОРТИРОВКА РАЗВЁРНУТА ОБРАТНО НА ВОЗРАСТАНИЕ. Разворот на -price
# делался, когда снизу выдачи лез мусор — цифровые коды и синглы. Но
# мусор создавали баги B-2 и B-3, и они закрыты сторожами. Причина
# разворота исчезла, а последствие осталось: выдача у потолка в $20 —
# это цены вдвое выше рынка, то есть вся маржа ветки.
ebay_sort: price
# Доставка по США, когда продавец её не назвал. НОЛЬ ЗДЕСЬ ЗАПРЕЩЁН:
# подстановка нуля вместо неизвестной доставки занизила landed у
# 46 591 аукционного лота из 89 282 в винильной ветке.
us_ship_fallback_usd: 4.50

# --- пороги ---
# Правило 3x с винила сюда НЕ переносится: на sealed-паках реальный
# мультипликатор 1.5-2.2x, деньги делаются оборотом и плотностью.
# Порог 3.0 не нашёл бы ничего.
# Основной гейт ветки — прибыль на килограмм, а не мультипликатор.
# Поэтому порог по мультипликатору опущен: он отсекающий, а не решающий.
min_multiple_packs: 1.75
min_profit_per_kg_usd: 150.0
watch_multiple: 1.4
# min_multiple_tins удалён вместе с сегментом: см. kind_denylist.

# СЕГМЕНТ. Расчёт на весах × 1.15, карго $22/кг, курс 86.59 при
# мультипликаторе 1.75: пак 25 г брутто даёт ~$330/кг, checklane ~$160,
# блистер-тройка ~$145, а мини-тин 253 г — ~$76 и не проходит гейт
# $150/кг НИ ПРИ КАКОЙ реалистичной цене в Москве. Тины исключены не
# порогом, а из сегмента: порог они не проходят по устройству товара.
kind_allowlist: [booster_pack, sleeved_booster, blister_checklane,
                 blister_3pack, booster_bundle_6]

# СКОЛЬКО ПАКОВ ВНУТРИ ОДНОЙ ЕДИНИЦЫ ТОВАРА. Нужно, чтобы порог
# min_units_per_lot считался по пакам, а не по позициям: иначе один
# бустер-бандл (шесть паков в коробке, одна позиция) отсекался бы
# наравне с одиночным паком, хотя доставка по США на нём размазана
# ровно так же, как на лоте из шести паков.
# Числа — комплектация товара из CardText каталога TCGplayer, не оценка.
packs_per_unit:
  booster_pack: 1
  sleeved_booster: 1
  blister_checklane: 1
  blister_3pack: 3
  booster_bundle_6: 6
kind_denylist:  [mini_tin, tin, build_and_battle, etb]

# ДОЛЯ ОТ ЦЕНЫ РФ — ПО ИСТОЧНИКУ, А НЕ ОДНА КОНСТАНТА. Плоские 0.65 не
# могут описывать одновременно реально ушедшую сделку и хотелку
# витрины: это величины разной природы.
#
# derived: null — расчётная цена (например, 16 190 ₽ за бандл, делённые
# на 6) BUY не даёт НИКОГДА. Строка booster_pack = 2 698 ₽ в сид-таблице
# получена так и относится к 30th Celebration — юбилейному премиум-
# набору. Перенести её на обычный пак ME01 значит подменить товар, а
# выглядит она как данные, и потому опаснее отсутствия строки.
ru_discount_by_basis:
  avito_sold: 0.95           # реально ушло — почти без скидки
  avito_ask:  0.72           # запрошено на Авито
  pokemarket: 0.80           # C2C, ближе к рынку чем витрина
  shelf:      0.55           # витрина Pokebarn — верхняя граница, не цена
  derived:    null           # расчётная — WATCH всегда, BUY запрещён

# --- продавец ---
seller_min_feedback_pct: 98.5
seller_min_feedback_score: 100
require_additional_images: true

# --- подделки ---
# Цена ниже этой доли от marketPrice TCGplayer означает либо подделку,
# либо вскрытый пак. Автоматический REJECT.
cheap_fraction_of_market: 0.60
# ПРАВИЛО 60% НЕ ПРИМЕНЯЕТСЯ, ЕСЛИ РАЗРЫВ МЕНЬШЕ ЭТОЙ СУММЫ. На товаре
# за $2.67 разрыв в $1.17 — шум, а не признак подделки: так «Trick or
# Trade BOOster Bundle» за $1.50 получал REJECT. На товаре за $50 три
# доллара ничего не значат, и защита работает в полную силу.
market_gap_min_usd: 3.00

# КАКИЕ КАТАЛОГИ TCGCSV ТЯНЕМ. 3 — английский Pokemon, 85 — Pokemon
# Japan. Японский ВЫКЛЮЧЕН осознанно: замер 06.09.2026 показал, что
# нижний край полосы $5-13 — почти сплошь японские и корейские паки
# (Snow Hazard SV2P, Raging Surf SV3a, Time Gazer S10D), а английского
# дешевле $9 в категории практически нет. Дешёвое предложение есть, но
# это другой товар — другая цена в Москве, другой спрос. Включать
# только вместе со строками ru_comps.csv под него.
catalog_categories: [3]      # добавить 85, чтобы включить японский

# --- даты выхода наборов ---
# Пак невышедшего набора — это предзаказ (деньги заморожены, срок
# неизвестен, везти нечего) либо подделка. Живой случай 06.09.2026: в
# верх need_comps попал «бустер-пак ME06 Delta Reign за $5.78» при дате
# выхода набора 06.11.2026 — через два месяца.
# PREORDER — НЕ REJECT: товар настоящий, просто не сейчас, и мешать его
# с подделками нельзя.
min_days_since_release: 14
# Старые наборы не запрещены, но в список «что померить» наверх
# подниматься не должны: в Москве спрос идёт на текущую серию, а
# одиночные паки из наборов пятилетней давности — это паки из давно
# вскрытых боксов, то есть зона перевзвешивания.
release_age_penalty_months: 18

# --- сеты ---
set_allowlist: []            # пусто = все; заполняется по факту спроса
set_denylist:                # винтаж 1999-2002 в чеке до $20 — почти
  - "Base Set"               # гарантированно подделка или вскрытый пак
  - "Jungle"
  - "Fossil"
  - "Team Rocket"
  - "Neo"
  - "Gym Heroes"
  - "Gym Challenge"

# --- объём прогона ---
# Категория 183456 при цене до $20 и NEW содержит 46 807 лотов,
# 183457 — 14 070 (замер 06.09.2026). Обойти целиком нельзя: суточный
# лимит Browse API порядка 5 000 запросов при странице в 200 позиций.
# Берём верх выдачи по цене и говорим об этом в отчёте прямо.
per_category_items: 1000
max_item_detail_calls: 300

# РЕЖИМ ПО УМОЛЧАНИЮ — ТОЧЕЧНЫЙ. Обойти 60 877 лотов при квоте ~5 000
# запросов нельзя, и не нужно: BUY всё равно требует цены в Москве.
# discover ходит раз в неделю с жёстким бюджетом и вердиктов не выдаёт
# вовсе — его единственная задача кормить need_comps.
default_mode: targeted
discover_budget_calls: 500

# ГЕЙТ СЧИТАЕТСЯ ПО ПЕССИМИСТИЧНОМУ ВЕСУ. Веса в weights_g.yaml не
# замерены, но вес пака известен публично с точностью ±10% (20-23 г —
# это подтверждают и сами мошеннические листинги «Weighted Heavy 22.9
# Grams»). Настоящая неопределённость — упаковка и перепаковка на
# складе карго. Запас в 30% снимает вопрос сегодня, вместо того чтобы
# ждать весов как условия запуска.
weight_pessimism: 1.30
