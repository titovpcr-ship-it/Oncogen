# =====================================================================
# Ветка pokemon_tcg — запечатанные бустер-паки и мини-тины до $20
# =====================================================================
# Составлено 06.09.2026 по заданию заказчика. Отдельный файл, чтобы не
# смешивать с винилом: у веток разные ограничения. В виниле ограничение
# — деньги, здесь — КИЛОГРАММЫ. Карго берёт $22 за кг с минимумом в
# один кг, и посылка на сто граммов стоит те же $22, поэтому главная
# метрика ранжирования — прибыль на килограмм, а мультипликатор
# работает только отсекающим фильтром.
# =====================================================================

meta:
  branch: pokemon_tcg
  created: "2026-09-06"
  segment: "sealed booster packs & mini tins, <= $20, US sellers only"

# --- карго ---
# Тариф тот же, что в винильной ветке, и по той же причине: это тариф
# конкретного американского форвардера заказчика, а не рыночная
# средняя. Минимум в 1 кг — то, из-за чего ветка вообще работает в
# сегменте до $20: дешёвые лёгкие позиции добивают вес корзины.
cargo_usd_per_kg: 22.0
cargo_min_kg: 1.0
cargo_round_step_kg: 1.0     # поставь 0.1, если карго считает подробнее
pack_overhead: 1.15          # упаковка и пузырчатка сверх веса нетто

# --- деньги ---
usdrub_source: cbr           # cbr-xml-daily, кэш на сутки в cache/usdrub.json
max_item_price_usd: 20.0
# Доставка по США, когда продавец её не назвал. НОЛЬ ЗДЕСЬ ЗАПРЕЩЁН:
# подстановка нуля вместо неизвестной доставки занизила landed у
# 46 591 аукционного лота из 89 282 в винильной ветке.
us_ship_fallback_usd: 4.50

# --- пороги ---
# Правило 3x с винила сюда НЕ переносится: на sealed-паках реальный
# мультипликатор 1.5-2.2x, деньги делаются оборотом и плотностью.
# Порог 3.0 не нашёл бы ничего.
min_multiple_packs: 2.0
min_multiple_tins: 2.6       # тины проходят только при исключительной цене
min_profit_per_kg_usd: 150.0
watch_multiple: 1.6
# Доля от витрины Pokebarn/PokeMarket, по которой реально уходит на
# Авито. Витрина — верхняя граница, клиринг ниже; занижать собственную
# выручку безопаснее, чем завышать.
ru_discount: 0.65

# --- продавец ---
seller_min_feedback_pct: 98.5
seller_min_feedback_score: 100
require_additional_images: true

# --- подделки ---
# Цена ниже этой доли от marketPrice TCGplayer означает либо подделку,
# либо вскрытый пак. Автоматический REJECT.
cheap_fraction_of_market: 0.60

# --- сеты ---
set_allowlist: []            # пусто = все; заполняется по факту спроса
set_denylist:                # винтаж 1999-2002 в чеке до $20 — почти
  - "Base Set"               # гарантированно подделка или вскрытый пак
  - "Jungle"
  - "Fossil"
  - "Team Rocket"
  - "Neo"
  - "Gym Heroes"
  - "Gym Challenge"

# --- объём прогона ---
# Категория 183456 при цене до $20 и NEW содержит 46 807 лотов,
# 183457 — 14 070 (замер 06.09.2026). Обойти целиком нельзя: суточный
# лимит Browse API порядка 5 000 запросов при странице в 200 позиций.
# Берём верх выдачи по цене и говорим об этом в отчёте прямо.
per_category_items: 1000
max_item_detail_calls: 300
