<script>
if ((location.pathname === '/' || location.pathname === '/index.html') && /(?:^|[?&])(lang|t|letter|daily|phrases|name|pen|abc|listen|family|paywall|doc|gift|teach|start|switch|welcome|from|root)=/i.test(location.search) && !document.querySelector('meta[name="robots"]')) {var robots=document.createElement('meta');robots.name='robots';robots.content='noindex, follow';document.head.appendChild(robots);}
/* O-205: защита хостинга иногда отдаёт страницу-заглушку вместо скрипта — тогда один раз перезагрузить страницу;
   приложение так и не запустилось — через 8 с показать обложку, уже лежащую в HTML (иначе пустой экран). */
(function(){var K='barik-rl';addEventListener('error',function(e){var t=e.target;if(!t||t.tagName!=='SCRIPT'||t.hasAttribute('data-barik-retry')||!/\/js\//.test(t.src||''))return;
try{if(sessionStorage.getItem(K))return;sessionStorage.setItem(K,'1');}catch(x){return;}setTimeout(function(){location.reload();},1200);},true);
setTimeout(function(){var h=document.documentElement;if(!window.__barikOk)h.className=h.className.replace(/\s*nopre/g,'');},8000);})();</script>
