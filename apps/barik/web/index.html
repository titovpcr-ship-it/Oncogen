<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Армянские слова</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Noto+Serif+Armenian:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#F3F1F6; --surface:#FFFFFF; --surface-2:#EAE6F0; --ink:#23182C; --ink-2:#5F546A; --ink-3:#8A8094; --line:#DCD5E4;
  --accent:#EC8B2E; --accent-press:#D97A1F; --on-accent:#2A1503; --accent-soft:#FDE7D2;
  --ok:#23845F; --ok-soft:#DDF3E9; --bad:#B42F45; --bad-soft:#F9DEE3; --focus:#3557A6;
  --shadow:0 1px 0 rgba(35,24,44,.05),0 10px 26px -16px rgba(35,24,44,.35);
  --hy:"Noto Serif Armenian","Noto Sans Armenian","Mshtakan","Sylfaen",serif;
  --ui:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --emo:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151019; --surface:#201A27; --surface-2:#2B2333; --ink:#F3EDF6; --ink-2:#BDB1C7; --ink-3:#8F849A; --line:#382F42;
    --accent:#FF9F4A; --accent-press:#F08C33; --on-accent:#2A1503; --accent-soft:#40291A;
    --ok:#4CC99A; --ok-soft:#14372B; --bad:#FF7489; --bad-soft:#45202A; --focus:#9DB4FF;
    --shadow:0 1px 0 rgba(0,0,0,.35),0 12px 28px -16px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151019; --surface:#201A27; --surface-2:#2B2333; --ink:#F3EDF6; --ink-2:#BDB1C7; --ink-3:#8F849A; --line:#382F42;
  --accent:#FF9F4A; --accent-press:#F08C33; --on-accent:#2A1503; --accent-soft:#40291A;
  --ok:#4CC99A; --ok-soft:#14372B; --bad:#FF7489; --bad-soft:#45202A; --focus:#9DB4FF;
  --shadow:0 1px 0 rgba(0,0,0,.35),0 12px 28px -16px rgba(0,0,0,.8);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--ui);overflow-x:clip;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
[lang="hy"]{font-family:var(--hy)}

#view{max-width:560px;margin:0 auto;padding:18px 18px calc(92px + env(safe-area-inset-bottom,0px))}
body[data-view="session"] #view{padding-bottom:calc(170px + env(safe-area-inset-bottom,0px))}

/* tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:4px;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);
  background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.tab{flex:1;max-width:180px;border:0;background:none;padding:6px 4px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--ink-3)}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{color:var(--accent)}
body[data-view="session"] #tabs{display:none}

/* home */
.head{padding:6px 2px 0}
.head h1{font-family:var(--hy);font-weight:600;font-size:clamp(36px,10vw,46px);line-height:1.08;margin:0}
.head p{margin:6px 0 0;color:var(--ink-2)}
.head h1.pg{font-family:var(--ui);font-size:28px;font-weight:700;line-height:1.15}
.today{margin:20px 0 30px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow)}
.summary{margin:0 0 14px;font-size:17px;line-height:1.4}
.summary b{font-weight:600}
.streak{display:inline-flex;align-items:center;gap:6px;margin:0 0 12px;padding:4px 11px;border-radius:999px;background:var(--accent-soft);font-size:14px}
.voice-note{margin:14px 0 0;font-size:14px;color:var(--ink-2)}
.voice-note button{border:0;background:none;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.actions{display:grid;gap:10px}
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:54px;padding:10px 18px;border-radius:16px;border:1.5px solid transparent;font-weight:600;font-size:17px;line-height:1.2;text-align:center}
.btn .cap{display:block;font-weight:400;font-size:13px;opacity:.78;margin-top:2px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:active{background:var(--accent-press)}
.btn.secondary{background:var(--surface-2);color:var(--ink)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink-2)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.l{background:var(--accent);background:color-mix(in srgb,var(--accent) 65%,transparent)}
h2.sec{font-size:15px;font-weight:600;color:var(--ink-2);margin:0 2px 6px}
.topics{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.topic{width:100%;display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.t-ic{width:48px;height:48px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font:26px/1 var(--emo)}
.t-body{min-width:0}
.t-name{display:block;font-weight:600}
.t-hy{display:block;font-family:var(--hy);color:var(--ink-2);font-size:14px;margin:1px 0 7px;overflow-wrap:anywhere}
.t-cnt{font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}

/* topic page */
.back{border:0;background:none;color:var(--ink-2);font-size:16px;padding:6px 0 10px}
.thead{display:flex;gap:14px;align-items:center;margin:0 0 12px}
.thead .t-ic{width:64px;height:64px;font-size:36px;border-radius:18px;flex:none}
.pg{font-size:28px;line-height:1.15;margin:0;font-weight:700}
.t-hy2{font-family:var(--hy);color:var(--ink-2);margin:2px 0 0;font-size:17px}
.page-actions{margin:14px 0 18px}

/* word rows */
.words{list-style:none;margin:6px 0 0;padding:0}
.wrow{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.w-pic{width:44px;height:44px;display:grid;place-items:center;font-size:28px}
.w-main{min-width:0}
.w-hy{display:block;font-size:21px;line-height:1.25;overflow-wrap:anywhere}
.w-sub{display:block;font-size:14px;color:var(--ink-2);overflow-wrap:anywhere}
.w-tr{color:var(--ink-3);margin-left:8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px;background:var(--line)}
.dot.s-learning{background:var(--accent)}
.dot.s-learned{background:var(--ok)}
.say{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.say svg{width:20px;height:20px}
.say.on,.aud.on{border-color:var(--accent);background:var(--accent-soft)}
.empty{padding:22px 4px;color:var(--ink-2)}

/* pictures */
.emo{font-family:var(--emo);line-height:1}
.sw{display:inline-block;width:1em;height:1em;border-radius:50%;border:1.5px solid rgba(128,118,140,.45)}
.ptx{font-family:var(--ui);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.w-pic .ptx{font-size:.62em}
.o-pic .ptx{font-size:.72em}

/* letter tiles for words without a picture */
.ltr{display:inline-grid;place-items:center;width:1em;height:1em;border-radius:.24em;background:hsl(var(--h) 65% 91%);color:hsl(var(--h) 45% 30%)}
.ltr b{font:600 .58em/1 var(--hy)}
.w-pic .ltr{font-size:40px}
.pic-xl .ltr{font-size:104px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ltr{background:hsl(var(--h) 30% 22%);color:hsl(var(--h) 70% 82%)}}
:root[data-theme="dark"] .ltr{background:hsl(var(--h) 30% 22%);color:hsl(var(--h) 70% 82%)}
.lvl{margin-top:26px}
.lvh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 2px}
.lv{font-weight:700;font-size:24px;line-height:1}
.lvc{font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.lvd{margin:4px 2px 10px;font-size:14px;color:var(--ink-2)}
button.lvh{width:100%;border:0;background:none;padding:6px 2px;text-align:left;color:var(--ink);cursor:pointer}
.lvh .lvc{margin-left:auto}
.chev{color:var(--ink-3);font-size:24px;line-height:1;transition:transform .2s;margin-left:6px}
.lvh[aria-expanded="true"] .chev{transform:rotate(90deg)}
.lv-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}
.btn.sm{min-height:44px;font-size:15px;padding:8px 10px}
.flag{margin-top:14px;border:0;background:none;color:var(--ink-3);font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:6px}
.flagtxt{width:100%;min-height:120px;margin-top:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:10px;font:14px/1.4 var(--ui)}
.result .note{text-align:center}
.more-li{list-style:none;padding:14px 0}
.more-li .btn{width:100%}
.opts.nopic .opt{min-height:72px}

/* session */
.sess-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 0 10px;margin:-10px 0 4px}
.x{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface-2);font-size:19px;line-height:1}
.pbar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease}
.pcount{font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.stage{display:flex;flex-direction:column;align-items:center;text-align:center}
.q{margin:8px 0 8px;color:var(--ink-2);font-size:15px}
.pic-xl{font-size:92px;min-height:112px;display:grid;place-items:center;margin:2px 0 4px}
.pic-xl .ptx{font-size:.8em}
.hyw{font-family:var(--hy);font-weight:600;font-size:58px;line-height:1.18;white-space:nowrap;max-width:100%;overflow:hidden;margin:0 0 4px;padding:0 2px}
.hyw.phrase{white-space:normal;overflow-wrap:anywhere}
.lt{display:inline-block;animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(.24em)}to{opacity:1;transform:none}}
.trn{color:var(--ink-2);font-size:17px;margin:0 0 2px;overflow-wrap:anywhere}
.ruw{font-size:22px;font-weight:600;margin:4px 0 0;overflow-wrap:anywhere}
.audio{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0 2px}
.aud{height:46px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;gap:8px;font-size:15px}
.aud svg{width:21px;height:21px}
.approx{font-size:12px;color:var(--ink-3);margin-top:4px}
.opts{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.opts.list{grid-template-columns:1fr}
.opt{min-width:0;min-height:106px;padding:12px 10px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center}
.o-pic{font-size:38px;min-height:42px;display:grid;place-items:center}
.o-lbl{font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.opts.list .opt{min-height:62px;flex-direction:row;justify-content:space-between;padding:12px 16px;text-align:left}
.o-hy{font-size:25px;line-height:1.2;overflow-wrap:anywhere;min-width:0}
.o-tr{font-size:14px;color:var(--ink-3);padding-left:10px;text-align:right}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);animation:pop .32s ease}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .32s ease}
.opt.dim{opacity:.45}
.opt:disabled{cursor:default;color:var(--ink)}
@keyframes pop{50%{transform:scale(1.035)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.play-big{width:116px;height:116px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin:8px 0 10px}
.play-big svg{width:50px;height:50px}
.play-big.on{background:var(--accent-press)}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:18px 0 6px;max-width:100%}
.slot{height:54px;border-radius:12px;border:0;border-bottom:2.5px solid var(--ink-3);background:var(--surface-2);font:600 26px/1 var(--hy);display:grid;place-items:center;padding:0}
.slot.fill{background:var(--surface);border-bottom-color:var(--accent)}
.slot.ok{background:var(--ok-soft);border-bottom-color:var(--ok)}
.slot.bad{background:var(--bad-soft);border-bottom-color:var(--bad)}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:12px;max-width:100%}
.tile{min-width:50px;height:54px;padding:0 10px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font:600 26px/1 var(--hy);box-shadow:0 2px 0 var(--line)}
.tile.used{visibility:hidden}
.answer-word{margin-top:10px}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px))}
.foot.ok{background:var(--ok-soft);border-top-color:var(--ok)}
.foot.bad{background:var(--bad-soft);border-top-color:var(--bad)}
.foot-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.fb{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 8px;font-weight:600;font-size:16px}
.fb.ok{color:var(--ok)}
.fb.bad{color:var(--bad)}
.fb .ans{font-weight:400;color:var(--ink);overflow-wrap:anywhere}
.fb .ans b{font-family:var(--hy);font-weight:600;font-size:20px;margin-right:4px}
.row2{display:flex;gap:10px}
.row2 .btn{flex:1}

/* results */
.result{text-align:center;padding:26px 0 0}
.apres{font-family:var(--hy);font-weight:700;font-size:66px;line-height:1.1;margin:6px 0 2px}
.result .sub{color:var(--ink-2);margin:0}
.score{font-size:20px;margin:22px 0 4px}
.miss-h{font-size:15px;color:var(--ink-2);margin:20px 0 0;text-align:left}
.result .words{text-align:left;margin-bottom:22px}

/* settings */
.set-sec{margin:24px 0 0}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.set-row.col{flex-direction:column;align-items:stretch}
.lbl{min-width:0}
.lbl b{display:block;font-weight:600}
.lbl span{display:block;font-size:14px;color:var(--ink-2)}
.switch{width:52px;height:32px;border-radius:99px;border:0;background:var(--surface-2);position:relative;flex:none;box-shadow:inset 0 0 0 1px var(--line)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch[aria-pressed="true"]{background:var(--ok);box-shadow:none}
.switch[aria-pressed="true"]::after{transform:translateX(20px)}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px;flex:none}
.seg button{border:0;background:none;padding:8px 11px;border-radius:9px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
select{width:100%;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.note{font-size:14px;color:var(--ink-2);margin:8px 0 0;line-height:1.45}
.legend{list-style:none;margin:8px 0 0;padding:0;font-size:15px}
.legend li{padding:5px 0}
.legend b{display:inline-block;min-width:38px;font-weight:600}
.search{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.filters{margin:10px 0 4px}

#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;width:max-content;max-width:min(92vw,460px);z-index:50;transition:opacity .2s,transform .2s;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="view"></main>
<nav id="tabs" aria-label="Разделы">
  <button class="tab" data-act="tab" data-arg="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/></svg><span>Учить</span></button>
  <button class="tab" data-act="tab" data-arg="dict"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 19.5V5.5"/></svg><span>Словарь</span></button>
  <button class="tab" data-act="tab" data-arg="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Настройки</span></button>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';

/* ================= DATA ================= */
const TOPICS=[
{lv:'A1',ru:'Основы',hy:'Հիմունքներ',ic:'👋',w:[

const MAP={'ա':'а','բ':'б','գ':'г','դ':'д','զ':'з','է':'э','ը':'ы','թ':'тʰ','ժ':'ж','ի':'и','լ':'л','խ':'х','ծ':'ц','կ':'к','հ':'һ','ձ':'дз','ղ':'гх','ճ':'ч','մ':'м','ն':'н','շ':'ш','չ':'чʰ','պ':'п','ջ':'дж','ռ':'р','ս':'с','վ':'в','տ':'т','ր':'р','ց':'цʰ','փ':'пʰ','ք':'кʰ','օ':'о','ֆ':'ф'};
const VOW=new Set(['ա','ե','է','ը','ի','ո','օ','և']);
function isCons(c){return !!c && /[ա-ֆ]/.test(c) && !VOW.has(c) && c!=='ւ';}
function trWord(s,tts){
  s=s.toLowerCase(); let o='';
  for(let i=0;i<s.length;i++){
    const c=s[i], nx=s[i+1]||'', pv=s[i-1]||'';
    if(c==='ո'&&nx==='ւ'){o+='у';i++;continue;}
    if(c==='և'){o+=(tts&&isCons(pv))?'эв':'ев';continue;}
    if(c==='յ'){
      if(nx==='ո'&&s[i+2]==='ւ'){o+='ю';i+=2;continue;}
      if(nx==='ա'){o+='я';i++;continue;}
      if(nx==='ե'){o+='е';i++;continue;}
      o+='й';continue;
    }
    if(c==='ի'&&nx==='ա'){o+='ия';i++;continue;}
    if(c==='ո'){o+=(i===0&&!s.startsWith('ով'))?'во':'о';continue;}
    if(c==='ե'){o+=(tts&&i>0&&isCons(pv))?'э':'е';continue;}
    if(c==='ղ'&&tts){o+=VOW.has(nx)?'г':'х';continue;}
    let m=MAP[c]; if(m===undefined) m=c;
    if(tts) m=m.replace('ʰ','').replace('һ','х');
    o+=m;
  }
  return o;
}
const RV='аеэиоуыяю';
function stress(w){
  const idx=[]; for(let i=0;i<w.length;i++) if(RV.includes(w[i])) idx.push(i);
  if(idx.length<2) return w;
  let k=idx[idx.length-1]; if(w[k]==='ы') k=idx[idx.length-2];
  return w.slice(0,k+1)+'\u0301'+w.slice(k+1);
}

const cloud={db:null,base:'',ready:false,busy:false,again:false,last:{},timer:null};
function lvOf(a){const w=BY[a];return w?TOPICS[w.t].lv:'X';}
function cloudDocs(){

async function getDoc(id){
  const ref=cloud.db.doc(cloud.base+id);
  try{return await ref.get();}catch(e){
    if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,700+Math.random()*700)); try{return await ref.get();}catch(e2){return null;}}

async function initCloud(){
  if(!window.claude||typeof window.claude.use!=='function') return;
  try{
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user) return;
    const uid=await user.id(); if(!uid) return;
    cloud.db=db; cloud.base='data/users/'+uid+'/';
    const ids=['progress','meta'].concat(LEVELS.map(l=>'w_'+l),['w_X']);
    const snaps=await Promise.all(ids.map(getDoc));
    snaps.forEach((snap,i)=>{
      if(!snap||!snap.exists) return; const d=snap.data(); if(!d||typeof d.s!=='string') return;
      let o; try{o=JSON.parse(d.s);}catch(e){return;}
      if(ids[i]==='progress') mergeRemote(o);
      else if(ids[i]==='meta') mergeRemote(Object.assign({w:{}},o));
      else mergeRemote({w:o});
    });
    cloud.ready=true; writeLocal(); cloudSave(true);
    if(view!=='session') render();
  }catch(e){cloud.ready=false;}
}
function mergeRemote(R){
  if(!R||typeof R!=='object'||!R.w) return;
  const rReset=R.reset||0;
  if(rReset>(S.reset||0)){ for(const k in S.w){ if((S.w[k].t||0)<rReset) delete S.w[k]; } S.reset=rReset; }
  for(const k in R.w){const x=R.w[k], y=S.w[k]; if(!x||(x.t||0)<(S.reset||0)) continue; if(!y||(x.t||0)>(y.t||0)) S.w[k]=x;}
  if(R.set&&(R.u||0)>(S.u||0)) S.set=Object.assign({},S.set,R.set);
  if(R.st){ if((R.st.day||0)>(S.st.day||0)) S.st=Object.assign({},R.st); else if(R.st.day===S.st.day) S.st.streak=Math.max(S.st.streak||0,R.st.streak||0); }
  if(R.flag) S.flag=Object.assign({},R.flag,S.flag||{});
}
function cloudSave(now){ if(!cloud.ready) return; clearTimeout(cloud.timer); cloud.timer=setTimeout(flushCloud, now?60:1500); }
async function flushCloud(){
  if(!cloud.ready||!cloud.db) return;
  if(cloud.busy){cloud.again=true;return;}
  cloud.busy=true;
  try{
    const docs=cloudDocs();
    for(const id in docs){
      if(docs[id]===cloud.last[id]) continue;
      if(id!=='meta'&&docs[id]==='{}'&&cloud.last[id]===undefined){cloud.last[id]=docs[id];continue;}
      await cloud.db.doc(cloud.base+id).set({s:docs[id],u:S.u});
      cloud.last[id]=docs[id];
    }
  }catch(e){
    const c=e&&e.code;
    if(c==='unavailable') setTimeout(flushCloud,1200+Math.random()*1200);
    else if(['revoked','invalid_argument','not_granted','capability_disabled','quota_exceeded'].indexOf(c)>=0) cloud.ready=false;
  }finally{ cloud.busy=false; if(cloud.again){cloud.again=false;flushCloud();} }
}

const ALPHA='աբգդեզէըթժիլխծկհձղճմյնշոչպջռսվտրցփքօֆ';
const CONF={'պ':'բփ','բ':'պփ','փ':'պբ','տ':'դթ','դ':'տթ','թ':'տդ','կ':'գք','գ':'կք','ք':'կգ','ծ':'ցձ','ձ':'ծց','ց':'ծչ','ճ':'չջ','ջ':'ճչ','չ':'ցճ','ռ':'ր','ր':'ռ','ե':'էը','է':'ե','ը':'ե','ո':'օ','օ':'ո','ս':'զշ','զ':'սժ','շ':'սչ','ժ':'շզ','հ':'խ','խ':'հղ','ղ':'խգ','ն':'մ','մ':'ն','լ':'ղ','վ':'ֆ','ֆ':'վ','ու':'ո'};
function tilesOf(a){const o=[];for(let i=0;i<a.length;i++){if(a[i]==='ո'&&a[i+1]==='ւ'){o.push('ու');i++;}else o.push(a[i]);}return o;}
function canSpell(w){if(w.a.indexOf(' ')>=0) return false; const n=tilesOf(w.a).length; return n>=2&&n<=10;}
function makeSpell(w){
  const t=tilesOf(w.a), set=new Set(t), extra=[];
  for(const ch of shuffle(t)){const c=CONF[ch]; if(!c) continue; for(const x of [...c]){ if(!set.has(x)&&extra.indexOf(x)<0){extra.push(x);break;} } if(extra.length>=2) break;}
  let g=0; while(extra.length<3&&g++<200){const x=ALPHA[Math.floor(Math.random()*ALPHA.length)]; if(!set.has(x)&&extra.indexOf(x)<0) extra.push(x);}
  return {target:t, bank:shuffle(t.concat(extra)).map((ch,id)=>({ch,id,used:false})), ans:[]};
}
function makeOpts(w){
  const out=[w], usedR=new Set([w.r]), usedA=new Set([w.a]);
  const add=x=>{if(out.length>=4||usedR.has(x.r)||usedA.has(x.a)) return; out.push(x); usedR.add(x.r); usedA.add(x.a);};
  shuffle(TOPICS[w.t].list).forEach(add);
  if(out.length<4) shuffle(WORDS.filter(x=>x.t!==w.t)).forEach(add);
  return shuffle(out);
}
function mk(k,w,extra){
  const it=Object.assign({k,w},extra||{});
  if(k==='a2r'||k==='r2a'||k==='listen') it.opts=makeOpts(w);
  if(k==='spell') it.sp=makeSpell(w);
  return it;
}
function spread(arr){
  const a=shuffle(arr);
  for(let i=1;i<a.length;i++){ if(a[i].w===a[i-1].w){ for(let j=i+1;j<a.length;j++){ if(a[j].w!==a[i-1].w){[a[i],a[j]]=[a[j],a[i]];break;} } } }
  return a;
}
function kindFor(w){
  const s=S.w[w.a], b=s?s.b:1; let ks=['a2r','r2a'];
  if(b>=2){ if(audioOK()) ks.push('listen'); if(canSpell(w)) ks.push('spell'); }
  if(b>=4) ks=ks.filter(k=>k!=='a2r');
  return ks[Math.floor(Math.random()*ks.length)];
}

function startLearn(ti,lv){
  const list=lv?WORDS.filter(w=>TOPICS[w.t].lv===lv&&!S.w[w.a]).slice(0,S.set.size||10):nextNew(ti,S.set.size||10);

    const ch=list.slice(i,i+4);
    ch.forEach(w=>items.push(mk('intro',w)));
    const qs=[];

  }
  if(list.length>4) items.push(...spread(list.map(w=>mk(audioOK()&&Math.random()<.6?'listen':'r2a',w))));

  if(!due.length){toast('На сегодня повторять нечего.');return;}

}
function startCheck(list,meta){

function hardWords(){return WORDS.filter(w=>{const s=S.w[w.a];return s&&(s.e||0)>=2&&s.b<4;});}
function startHard(){

function defaultOpen(){for(const lv of LEVELS){if(WORDS.some(w=>TOPICS[w.t].lv===lv&&!S.w[w.a])) return lv;}return LEVELS[LEVELS.length-1];}
function isOpen(lv){const o=S.set.open; if(o&&Object.prototype.hasOwnProperty.call(o,lv)) return !!o[lv]; return lv===defaultOpen();}
function introMark(w){ if(!S.w[w.a]){ S.w[w.a]={b:1,d:today()+1,t:Date.now(),n:1,e:0}; touchStreak(); save(); } }
function record(it,ok){
  const a=it.w.a, td=today();
  if(sess.mode==='check'){
    if(!sess.first.has(a)){ sess.first.set(a,ok); if(ok&&!S.w[a]) S.w[a]={b:4,d:td+INT[4],t:Date.now(),n:1,e:0}; }
    touchStreak(); save(); return;
  }
  if(sess.first.has(a)){ touchStreak(); save(); return; }
  sess.first.set(a,ok);
  let s=S.w[a]; if(!s) s=S.w[a]={b:1,d:td+1,t:0,n:0,e:0};
  if(sess.mode!=='learn'){
    const isDue=s.d<=td;
    if(ok){ if(sess.mode==='review'||isDue){ s.b=Math.min(8,(s.b||0)+1); s.d=td+INT[s.b]; } }
    else { s.b=1; s.d=td+1; }
  }
  if(!ok) s.e=(s.e||0)+1;
  s.n=(s.n||0)+1; s.t=Date.now();
  touchStreak(); save();
}
function queueRepeat(it){
  const a=it.w.a; sess.reps[a]=(sess.reps[a]||0)+1; if(sess.reps[a]>2) return;
  const k=it.k==='listen'?'a2r':it.k;
  sess.items.splice(Math.min(sess.items.length,sess.i+3),0,mk(k,it.w,{rep:true}));
}
function answer(idx){
  const it=cur(); if(!it||it.done||!it.opts) return;
  const ok=it.opts[idx]===it.w;
  it.done=true; it.ok=ok; it.pick=idx;
  record(it,ok);
  if(!ok){ if(sess.mode!=='check') queueRepeat(it); buzz(); }
  render(false);
  if(!ok||it.k==='r2a'){ if(S.set.auto||it.k==='listen') speak(it.w,false); }
  if(ok) sess.timer=setTimeout(()=>{if(cur()===it) nextItem();}, it.k==='r2a'?1150:800);
}
function tileTap(id){
  const it=cur(); if(!it||it.done||it.k!=='spell') return;
  const sp=it.sp, t=sp.bank.find(b=>b.id===id); if(!t||t.used||sp.ans.length>=sp.target.length) return;
  t.used=true; sp.ans.push(id);
  if(sp.ans.length===sp.target.length) checkSpell(it); else render(false);
}
function slotTap(pos){
  const it=cur(); if(!it||it.done||it.k!=='spell') return;
  const sp=it.sp; if(pos>=sp.ans.length) return;
  const id=sp.ans.splice(pos,1)[0]; sp.bank.find(b=>b.id===id).used=false; render(false);
}
function erase(){const it=cur(); if(!it||it.done||it.k!=='spell') return; const sp=it.sp; const id=sp.ans.pop(); if(id==null) return; sp.bank.find(b=>b.id===id).used=false; render(false);}
function giveUp(){const it=cur(); if(!it||it.done) return; it.done=true; it.ok=false; it.got=it.sp.ans.map(id=>it.sp.bank.find(b=>b.id===id).ch); record(it,false); queueRepeat(it); render(false); speak(it.w,false);}
function checkSpell(it){
  const sp=it.sp; const got=sp.ans.map(id=>sp.bank.find(b=>b.id===id).ch);
  const ok=got.join('')===sp.target.join('');
  it.done=true; it.ok=ok; it.got=got;
  record(it,ok); if(!ok){queueRepeat(it);buzz();}
  render(false); speak(it.w,false);
  if(ok) sess.timer=setTimeout(()=>{if(cur()===it) nextItem();},1300);
}
function nextItem(){
  if(!sess) return; clearTimeout(sess.timer);
  sess.i++;
  if(sess.i>=sess.items.length){finish();return;}
  render(true); window.scrollTo(0,0);
}
function finish(){
  clearTimeout(sess.timer);
  if(!sess.first.size&&!sess.known){ sess=null; go('home'); return; }
  const firstOk=[...sess.first.values()].filter(Boolean).length;
  const missed=[...sess.first.entries()].filter(e=>!e[1]).map(e=>BY[e[0]]);
  sess.ended=true; sess.res={firstOk,n:sess.first.size,missed};
  view='result'; render(); window.scrollTo(0,0);
  flushCloud();
}

}

  acts+='<button class="btn ghost" data-act="tab" data-arg="home">На главную</button>';
  if(sess.mode==='check'){
    return '<div class="result"><div class="apres" lang="hy">'+(r.firstOk?'Ապրե՛ս':'Լավ է')+'</div><p class="sub">Проверка закончена</p>'+
      '<p class="score">Знакомых слов: <b>'+r.firstOk+' из '+r.n+'</b></p><p class="note">Знакомые слова вернутся на повторение через неделю. Остальные остались новыми — их можно пройти обычным уроком.</p><div class="actions">'+acts+'</div></div>';
  }
  const kn=sess.known?'<p class="note">Отмечено как уже известные: '+sess.known+' — вернутся на повторение через 15 дней.</p>':'';
  if(!r.n) return '<div class="result"><div class="apres" lang="hy">Լավ է</div>'+kn+'<div class="actions">'+acts+'</div></div>';
  const missed=r.missed.length?'<p class="miss-h">Стоит повторить:</p><ul class="words">'+r.missed.map(wordRow).join('')+'</ul>':'';
  const good=r.firstOk/r.n>=0.6;
  return '<div class="result"><div class="apres" lang="hy">'+(good?'Ապրե՛ս':'Լավ է')+'</div><p class="sub">'+(good?'«Молодец» по-армянски':'«Хорошо» — ошибки вернутся на повтор')+'</p>'+
    '<p class="score">С первого раза верно: <b>'+r.firstOk+' из '+r.n+'</b></p>'+kn+missed+'<div class="actions">'+acts+'</div></div>';
}
function audioRow(w){
  if(!SPEECH&&!hasReal(w)) return '';
  const av=activeVoice();
  return '<div class="audio"><button class="aud" data-act="say" data-arg="'+esc(w.a)+'">'+ICON.spk+'<span>Слушать</span></button><button class="aud" data-act="saySlow" data-arg="'+esc(w.a)+'"><span aria-hidden="true">🐢</span><span>Медленно</span></button></div>'+
    ((av&&!av.hy&&!hasReal(w))?'<div class="approx">≈ русский голос по транскрипции</div>':'');
}
function optCls(o,i,it){if(!it.done) return ''; if(o===it.w) return 'ok'; if(i===it.pick) return 'bad'; return 'dim';}
function optPic(o,i,it,sp){return '<button class="opt '+optCls(o,i,it)+'" data-act="opt" data-arg="'+i+'"'+(it.done?' disabled':'')+'>'+(sp?'<span class="o-pic">'+pic(o)+'</span>':'')+'<span class="o-lbl">'+esc(o.r)+'</span></button>';}
function optsPic(it){const sp=it.opts.every(o=>o.p);return '<div class="opts'+(sp?'':' nopic')+'">'+it.opts.map((o,i)=>optPic(o,i,it,sp)).join('')+'</div>';}
function optHy(o,i,it){return '<button class="opt '+optCls(o,i,it)+'" data-act="opt" data-arg="'+i+'"'+(it.done?' disabled':'')+'><span class="o-hy" lang="hy">'+esc(o.a)+'</span>'+((S.set.tr||it.done)?'<span class="o-tr">'+esc(o.tr)+'</span>':'')+'</button>';}
function fbFoot(it){
  const w=it.w;
  if(it.ok) return '<div class="fb ok">✓ Верно</div><button class="btn primary" data-act="next">Дальше</button>';
  return '<div class="fb bad"><span>Правильно:</span><span class="ans"><b lang="hy">'+esc(w.a)+'</b>'+esc(w.tr)+' — '+esc(w.r)+'</span></div><button class="btn primary" data-act="next">Дальше</button>';
}
function sessionHTML(){
  const it=cur(), w=it.w, n=sess.items.length;
  const top='<div class="sess-top"><button class="x" data-act="quit" aria-label="Закончить урок">✕</button><div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="'+n+'" aria-valuenow="'+sess.i+'"><i style="width:'+Math.round(100*sess.i/n)+'%"></i></div><span class="pcount">'+(sess.i+1)+'/'+n+'</span></div>';
  const ph=w.a.indexOf(' ')>=0?' phrase':'';
  let body='', foot='';
  if(it.k==='intro'){
    body='<p class="q">Новое слово</p><div class="pic-xl">'+pic(w)+'</div><div class="hyw'+ph+'" lang="hy">'+letters(w.a)+'</div><div class="trn">'+esc(w.tr)+'</div><div class="ruw">'+esc(w.r)+'</div>'+audioRow(w)+'<button class="flag" data-act="flag" data-arg="'+esc(w.a)+'">'+(S.flag&&S.flag[w.a]?'⚑ Отмечено: ошибка в слове':'⚑ Ошибка в слове?')+'</button>';
    foot='<div class="row2"><button class="btn secondary" data-act="know">Уже знаю</button><button class="btn primary" data-act="next">Дальше</button></div>';
  }else if(it.k==='a2r'){
    body='<p class="q">Что значит это слово?</p><div class="hyw'+ph+'" lang="hy">'+esc(w.a)+'</div>'+((S.set.tr||it.done)?'<div class="trn">'+esc(w.tr)+'</div>':'')+audioRow(w)+optsPic(it);
  }else if(it.k==='r2a'){
    body='<p class="q">Как это по-армянски?</p><div class="pic-xl">'+picQ(w)+'</div><div class="ruw">'+esc(w.r)+'</div><div class="opts list">'+it.opts.map((o,i)=>optHy(o,i,it)).join('')+'</div>';
  }else if(it.k==='listen'){
    body='<p class="q">Что вы слышите?</p><button class="play-big" data-act="sayCur" aria-label="Прослушать ещё раз">'+ICON.spk+'</button><button class="aud" data-act="sayCurSlow"><span aria-hidden="true">🐢</span><span>Медленно</span></button>'+
      (it.done?'<div class="hyw'+ph+' answer-word" lang="hy">'+esc(w.a)+'</div><div class="trn">'+esc(w.tr)+'</div>':'')+
      optsPic(it);
  }else if(it.k==='spell'){
    const sp=it.sp, cnt=sp.target.length;
    const wpx=Math.max(30,Math.min(46,Math.floor((Math.min(window.innerWidth,560)-40)/cnt)-6));
    let slots='';
    for(let p=0;p<cnt;p++){
      const id=sp.ans[p], ch=(id!=null)?sp.bank.find(b=>b.id===id).ch:'';
      let cls=ch?'fill':'';
      if(it.done){ const g=it.got&&it.got[p]; cls=(g&&g===sp.target[p])?'ok':'bad'; }
      slots+='<button class="slot '+cls+'" style="width:'+wpx+'px" data-act="slot" data-arg="'+p+'"'+(it.done?' disabled':'')+' aria-label="Буква '+(p+1)+'"><span lang="hy">'+esc(it.done?((it.got&&it.got[p])||''):ch)+'</span></button>';
    }
    const tiles=it.done?'':sp.bank.map(b=>'<button class="tile'+(b.used?' used':'')+'" data-act="tile" data-arg="'+b.id+'" lang="hy">'+esc(b.ch)+'</button>').join('');
    body='<p class="q">Соберите слово из букв</p><div class="pic-xl">'+picQ(w)+'</div><div class="ruw">'+esc(w.r)+'</div>'+audioRow(w)+'<div class="slots">'+slots+'</div>'+
      (it.done&&!it.ok?'<div class="hyw answer-word" lang="hy">'+esc(w.a)+'</div><div class="trn">'+esc(w.tr)+'</div>':'')+'<div class="tiles">'+tiles+'</div>';
    if(!it.done) foot='<div class="row2"><button class="btn secondary" data-act="erase">Стереть</button><button class="btn ghost" data-act="giveup">Не знаю</button></div>';
  }
  if(it.done) foot=fbFoot(it);
  return top+'<div class="stage">'+body+'</div>'+(foot?'<div class="foot'+(it.done?(it.ok?' ok':' bad'):'')+'"><div class="foot-in">'+foot+'</div></div>':'');
}

/* ================= EVENTS ================= */
const H={
  tab:a=>{ if(view==='session'&&sess&&!sess.ended){ finish(); return; } go(a); },
  topic:a=>{preloadAudio(TOPICS[+a].list); go('topic',+a);},
  learnNew:()=>startLearn(null),
  learnTopic:a=>startLearn(+a),
  learnAgain:()=>{const m=sess?sess.meta:{}; startLearn(m.ti!=null?m.ti:null,m.lv||null);},
  learnLevel:a=>startLearn(null,a),
  checkLevel:a=>startCheck(WORDS.filter(w=>TOPICS[w.t].lv===a),{lv:a}),
  checkTopic:a=>startCheck(TOPICS[+a].list,{ti:+a}),
  hard:()=>startHard(),
  lvtog:a=>{S.set.open=Object.assign({},S.set.open||{}); S.set.open[a]=!isOpen(a); save(); render();},
  know:()=>{
    const it=cur(); if(!it||it.k!=='intro') return;
    const w=it.w; S.w[w.a]={b:5,d:today()+INT[5],t:Date.now(),n:1,e:0}; touchStreak(); save();
    sess.known=(sess.known||0)+1;
    sess.items=sess.items.filter((x,i)=>i<=sess.i||x.w!==w);
    nextItem();
  },
  flag:a=>{S.flag=S.flag||{}; if(S.flag[a]) delete S.flag[a]; else S.flag[a]=1; save(); render(false); toast(S.flag[a]?'Отмечено. Список — в «Настройках».':'Отметка снята.');},
  copyFlags:()=>{
    const txt=Object.keys(S.flag||{}).filter(a=>BY[a]).map(a=>a+' — '+BY[a].tr+' — '+BY[a].r).join('\n');
    const fallback=()=>{const t=$('#flagtxt'); if(t){t.hidden=false; t.value=txt; t.focus(); t.select();} toast('Список выделен — скопируйте его вручную.');};
    try{ if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(()=>toast('Список скопирован.'),fallback); else fallback(); }catch(e){fallback();}
  },
  clearFlags:()=>{S.flag={}; save(); render();},
  review:()=>startReview(),
  practice:a=>startPractice(+a),
  say:(a,b)=>speak(BY[a],false,b,true),
  saySlow:(a,b)=>speak(BY[a],true,b,true),
  sayCur:(a,b)=>{const it=cur(); if(it) speak(it.w,false,b,true);},
  sayCurSlow:(a,b)=>{const it=cur(); if(it) speak(it.w,true,b,true);},
  opt:a=>answer(+a),
  next:()=>nextItem(),
  tile:a=>tileTap(+a),
  slot:a=>slotTap(+a),
  erase:()=>erase(),
  giveup:()=>giveUp(),
  quit:()=>finish(),
  more:()=>{dLimit+=150; const l=$('#dlist'); if(l) l.innerHTML=dictRows();},
  tog:a=>{S.set[a]=!S.set[a]; save(); render();},
  size:a=>{S.set.size=+a; save(); render();},
  reset:()=>{
    if(!resetArm){resetArm=Date.now(); render(); setTimeout(()=>{if(resetArm&&Date.now()-resetArm>=4900&&view==='settings'){resetArm=0;render();}},5000); return;}
    S.w={}; S.st={day:0,streak:0}; S.reset=Date.now(); resetArm=0; save(); flushCloud(); render(); toast('Прогресс сброшен.');
  }
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const f=H[b.dataset.act]; if(f) f(b.dataset.arg,b,e);
});
document.addEventListener('keydown',e=>{
  if(view!=='session'||!sess) return;
  const it=cur(); if(!it) return;
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')) return;
  if(/^[1-4]$/.test(e.key)&&it.opts&&!it.done){answer(+e.key-1);return;}
  if(e.key==='Enter'){ if(it.k==='intro'||it.done){e.preventDefault();nextItem();} return; }
  if(e.key===' '){e.preventDefault(); speak(it.w,false,null,true); return;}
  if(it.k==='spell'&&!it.done){
    if(e.key==='Backspace'){e.preventDefault();erase();return;}
    const k=(e.key||'').toLowerCase();
    const t=it.sp.bank.find(b=>!b.used&&(b.ch===k||(b.ch==='ու'&&k==='ու')));
    if(t) tileTap(t.id);
  }
});
window.addEventListener('resize',()=>{ if(view==='session') fitWords(); });
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') flushCloud(); });

/* ================= INIT ================= */
loadLocal();
if(SPEECH){
  loadVoices();
  try{ window.speechSynthesis.addEventListener('voiceschanged',loadVoices); }catch(e){ window.speechSynthesis.onvoiceschanged=loadVoices; }
  setTimeout(loadVoices,500); setTimeout(loadVoices,1800);
}
render();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ if(view==='session') fitWords(); });
initCloud();
window.__hy={WORDS,TOPICS,trWord,stress,AUD};
})();
</script>
